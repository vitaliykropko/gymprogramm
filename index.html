<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Фитнес Трекер">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07080b">
<title>Фитнес Трекер: Прогресс & Веса</title>
<style>
  :root {
    --bg: #07080b;
    --surface: #0e121a;
    --surface-2: #141924;
    --surface-3: #1a2232;
    --line: #20293b;
    --line-light: #2c3952;
    --chalk: #f8fafc;
    --chalk-dim: #94a3b8;
    
    /* ACCENTS: Cyber Cyan + Crimson Red */
    --cyan: #00f0ff;
    --cyan-hover: #3df3ff;
    --cyan-glow: rgba(0, 240, 255, 0.35);
    --cyan-dim: rgba(0, 240, 255, 0.12);
    
    --red: #ff2a5f;
    --red-hover: #ff4d79;
    --red-glow: rgba(255, 42, 95, 0.4);
    --red-dim: rgba(255, 42, 95, 0.15);
    
    /* Compatibility alias */
    --iron: #00f0ff;
    --iron-hover: #3df3ff;
    --iron-glow: rgba(0, 240, 255, 0.35);
    --iron-dim: rgba(0, 240, 255, 0.12);
    
    --steel: #64748b;
    --success: #00f0ff;
    --success-dim: rgba(0, 240, 255, 0.15);
    --gold: #ffb800;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--chalk);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding-bottom: calc(75px + env(safe-area-inset-bottom));
    user-select: none;
    background-color: #07080b;
    background-image: radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.04) 0%, transparent 60%);
  }
  input, button, select { font-family: inherit; }

  /* TOP HEADER */
  header.top-header {
    background: rgba(14, 18, 26, 0.88);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: max(12px, env(safe-area-inset-top));
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .header-left h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 900;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff 60%, var(--cyan) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header-left .meta {
    font-size: 11.5px;
    color: var(--chalk-dim);
    margin-top: 2px;
    letter-spacing: 0.2px;
  }
  .account-switcher {
    display: flex;
    align-items: center;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 3px 8px 3px 4px;
    cursor: pointer;
    transition: all 0.2s ease;
    gap: 7px;
  }
  .account-switcher:active {
    transform: scale(0.96);
    border-color: var(--cyan);
    box-shadow: 0 0 10px var(--cyan-glow);
  }
  .avatar-badge {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--red) 0%, #c40038 100%);
    color: #fff;
    font-size: 12px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 8px var(--red-glow);
  }
  .account-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--chalk);
    max-width: 90px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .account-arrow {
    font-size: 10px;
    color: var(--cyan);
  }

  /* MAIN CONTAINER */
  main#main {
    padding: 10px 14px 20px;
    max-width: 680px;
    margin: 0 auto;
  }

  /* WORKOUT HEADER BAR */
  .day-title-box {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 10px 4px 6px;
  }
  .day-title-box h2 {
    margin: 0;
    font-size: 22px;
    font-weight: 900;
    color: var(--chalk);
    letter-spacing: -0.01em;
  }
  .day-title-box .day-meta {
    font-size: 12.5px;
    color: var(--steel);
    font-weight: 600;
  }

  /* EXERCISE CARD */
  .ex-card, .exercise-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    margin-bottom: 16px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    transition: border-color 0.2s ease;
  }
  .ex-card:hover, .exercise-card:hover {
    border-color: var(--line-light);
  }
  .ex-card-header, .ex-header {
    display: flex;
    gap: 12px;
    padding: 14px 14px 10px;
    align-items: flex-start;
  }
  .ex-num {
    background: var(--surface-3);
    color: var(--cyan);
    font-weight: 900;
    font-size: 13px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid var(--cyan);
    box-shadow: 0 0 10px var(--cyan-glow);
    flex-shrink: 0;
  }
  .ex-icon {
    flex: 0 0 46px;
    width: 46px;
    height: 56px;
  }
  .ex-icon svg { width: 100%; height: 100%; overflow: visible; }
  .ex-header-body { flex: 1; min-width: 0; }
  .ex-title {
    font-size: 16.5px;
    font-weight: 900;
    margin: 0 0 5px;
    color: #ffffff;
    letter-spacing: -0.01em;
  }
  .ex-targets {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .target-badge {
    background: rgba(0, 240, 255, 0.1);
    border: 1px solid rgba(0, 240, 255, 0.35);
    border-radius: 5px;
    padding: 2px 8px;
    font-size: 11.5px;
    font-weight: 800;
    color: var(--cyan);
    letter-spacing: 0.3px;
  }
  .rest-badge {
    font-size: 11.5px;
    color: var(--steel);
    font-weight: 600;
  }
  .weight-ref-badge {
    display: inline-block;
    background: rgba(255, 42, 95, 0.1);
    border: 1px solid rgba(255, 42, 95, 0.3);
    color: var(--red);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    margin-top: 5px;
  }

  /* GIF VIDEO WRAP */
  .ex-video-box {
    margin: 6px 14px 10px;
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: #08090d;
    border: 1px solid var(--line);
    position: relative;
    cursor: pointer;
    min-height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ex-video-box video {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    object-fit: cover;
  }
  .video-play-btn {
    position: absolute;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(14, 18, 26, 0.88);
    border: 2px solid var(--cyan);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    transition: all 0.2s ease;
    opacity: 1;
    transform: scale(1);
    box-shadow: 0 0 20px var(--cyan-glow), 0 4px 16px rgba(0,0,0,0.7);
    z-index: 2;
  }
  .video-play-btn svg {
    margin-left: 3px;
    fill: var(--cyan);
  }
  .ex-video-box:not(.is-paused) .video-play-btn {
    opacity: 0;
    transform: scale(0.7);
    pointer-events: none;
  }
  .video-spinner {
    display: none;
    position: absolute;
    width: 34px;
    height: 34px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--cyan);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    pointer-events: none;
    z-index: 2;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .ex-video-box.is-buffering .video-spinner {
    display: block;
  }
  .ex-video-box.is-buffering .video-play-btn {
    display: none;
  }
  .video-tap-hint {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: rgba(7, 8, 11, 0.85);
    border: 1px solid var(--line);
    color: var(--chalk);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 2;
  }
  .video-error-banner {
    position: absolute;
    inset: 0;
    background: rgba(7, 8, 11, 0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--chalk-dim);
    font-size: 12.5px;
    padding: 16px;
    text-align: center;
    z-index: 3;
  }
  .video-error-banner a {
    color: var(--cyan);
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    padding: 7px 14px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  /* TIPS */
  .ex-tips {
    margin: 0 14px 12px;
    padding: 0;
    list-style: none;
  }
  .ex-tips li {
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--chalk-dim);
    position: relative;
    padding-left: 14px;
    margin-bottom: 4px;
  }
  .ex-tips li::before {
    content: "—";
    position: absolute;
    left: 0;
    color: var(--cyan);
  }

  /* SMART FORECAST CARD */
  .smart-forecast-card {
    margin: 8px 14px 12px;
    background: #0a0d14;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 11px 13px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.3);
    transition: all 0.2s ease;
  }
  .smart-forecast-card.increase {
    border-left: 4px solid var(--cyan);
    background: linear-gradient(90deg, rgba(0, 240, 255, 0.09) 0%, #0a0d14 60%);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.08);
  }
  .smart-forecast-card.maintain {
    border-left: 4px solid var(--red);
    background: linear-gradient(90deg, rgba(255, 42, 95, 0.09) 0%, #0a0d14 60%);
    box-shadow: 0 0 15px rgba(255, 42, 95, 0.08);
  }
  .smart-forecast-card.deload {
    border-left: 4px solid var(--gold);
    background: linear-gradient(90deg, rgba(255, 184, 0, 0.09) 0%, #0a0d14 60%);
  }
  .smart-forecast-card.baseline {
    border-left: 4px solid var(--cyan);
    background: linear-gradient(90deg, rgba(0, 240, 255, 0.06) 0%, #0a0d14 60%);
  }

  .forecast-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 9px;
  }
  .forecast-title-box {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .forecast-icon {
    font-size: 16px;
    line-height: 1;
  }
  .forecast-badge {
    font-size: 10.5px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2.5px 8px;
    border-radius: 4px;
    background: var(--surface-3);
    color: var(--chalk);
  }
  .forecast-badge.increase {
    background: var(--cyan-dim);
    color: var(--cyan);
    border: 1px solid rgba(0, 240, 255, 0.4);
    box-shadow: 0 0 8px var(--cyan-dim);
  }
  .forecast-badge.maintain {
    background: var(--red-dim);
    color: var(--red);
    border: 1px solid rgba(255, 42, 95, 0.4);
    box-shadow: 0 0 8px var(--red-dim);
  }
  .forecast-badge.deload {
    background: rgba(255, 184, 0, 0.15);
    color: var(--gold);
    border: 1px solid rgba(255, 184, 0, 0.35);
  }
  .forecast-badge.baseline {
    background: var(--cyan-dim);
    color: var(--cyan);
    border: 1px solid rgba(0, 240, 255, 0.3);
  }
  
  .btn-apply-forecast {
    background: rgba(255, 42, 95, 0.14);
    color: var(--red);
    border: 1px solid rgba(255, 42, 95, 0.4);
    font-size: 11px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .btn-apply-forecast:hover, .btn-apply-forecast:active {
    background: var(--red);
    color: #fff;
    border-color: var(--red);
    box-shadow: 0 0 12px var(--red-glow);
    transform: translateY(-1px);
  }

  .forecast-metrics {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    background: rgba(14, 18, 26, 0.7);
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 8px;
    border: 1px solid var(--line);
  }
  .forecast-metric-item {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .forecast-metric-item .f-lbl {
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--chalk-dim);
    margin-bottom: 2px;
  }
  .forecast-metric-item .f-val {
    font-size: 15px;
    font-weight: 900;
    color: #ffffff;
  }
  .forecast-metric-item .f-val.weight-up {
    color: var(--cyan);
    text-shadow: 0 0 10px var(--cyan-glow);
  }
  .forecast-metric-item .f-val.weight-keep {
    color: var(--red);
    text-shadow: 0 0 10px var(--red-glow);
  }
  .forecast-metric-item .f-val.weight-down {
    color: var(--gold);
  }
  .forecast-metric-item .f-val .f-unit {
    font-size: 11px;
    font-weight: 700;
    color: var(--chalk-dim);
  }

  .forecast-note {
    font-size: 12px;
    line-height: 1.45;
    color: var(--chalk-dim);
  }
  .forecast-note b {
    color: #ffffff;
  }

  /* SETS TRACKER TABLE */
  .sets-container {
    background: var(--surface-2);
    border-top: 1px solid var(--line);
    padding: 10px 12px 12px;
  }
  .sets-table {
    width: 100%;
    border-collapse: collapse;
  }
  .sets-table th {
    font-size: 10.5px;
    font-weight: 800;
    color: var(--steel);
    text-align: center;
    padding-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .sets-table th:first-child { text-align: left; width: 28px; }
  .sets-table th:nth-child(2) { text-align: left; width: 68px; }
  .sets-table th:last-child { width: 36px; }
  
  .set-row {
    border-bottom: 1px solid rgba(32, 41, 59, 0.7);
  }
  .set-row:last-child { border-bottom: none; }
  .set-num {
    font-size: 13px;
    font-weight: 800;
    color: var(--chalk-dim);
  }
  .set-prev {
    font-size: 11.5px;
    color: var(--steel);
    white-space: nowrap;
    font-weight: 600;
  }
  .set-inputs-cell {
    padding: 5px 2px;
  }
  .stepper-wrap {
    display: inline-flex;
    align-items: center;
    background: var(--surface-3);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    overflow: hidden;
    transition: border-color 0.15s ease;
  }
  .stepper-wrap:focus-within {
    border-color: var(--cyan);
    box-shadow: 0 0 8px var(--cyan-dim);
  }
  .stepper-btn {
    background: transparent;
    border: none;
    color: var(--chalk);
    font-size: 14px;
    font-weight: 800;
    width: 28px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.1s ease;
  }
  .stepper-btn:active {
    background: var(--line);
    color: var(--cyan);
  }
  .stepper-input {
    width: 44px;
    height: 32px;
    background: transparent;
    border: none;
    color: #ffffff;
    font-size: 14px;
    font-weight: 900;
    text-align: center;
    outline: none;
    user-select: text;
  }

  .done-btn {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--line);
    background: var(--surface-3);
    color: var(--steel);
    font-size: 15px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .done-btn:active {
    transform: scale(0.92);
  }
  .done-btn.completed {
    background: linear-gradient(135deg, var(--red) 0%, #d60036 100%);
    color: #ffffff;
    border-color: var(--red);
    box-shadow: 0 0 14px var(--red-glow);
  }
  .sets-actions {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    padding-top: 6px;
  }
  .action-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    font-size: 11.5px;
    font-weight: 700;
    border-radius: 5px;
    padding: 4px 10px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s ease;
  }
  .action-btn:active {
    background: var(--surface-3);
    color: var(--cyan);
    border-color: var(--cyan);
  }

  /* PROGRESSION RECO BOX */
  .prog-reco-box {
    margin: 8px 0 2px;
    padding: 8px 11px;
    background: rgba(0, 240, 255, 0.08);
    border-left: 3px solid var(--cyan);
    border-radius: 0 6px 6px 0;
    font-size: 12px;
    color: var(--chalk);
    line-height: 1.4;
  }
  .prog-reco-box b { color: var(--cyan); }

  /* FINISH WORKOUT BUTTON */
  .finish-workout-box {
    padding: 14px 4px 20px;
    text-align: center;
  }
  .btn-finish {
    width: 100%;
    background: linear-gradient(135deg, var(--red) 0%, #d60036 100%);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: var(--radius-md);
    padding: 15px 20px;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 6px 24px var(--red-glow);
    transition: all 0.15s ease;
  }
  .btn-finish:active {
    transform: scale(0.98);
    box-shadow: 0 2px 10px var(--red-glow);
  }

  /* FLOATING REST TIMER */
  .rest-timer-bar {
    position: fixed;
    bottom: calc(65px + env(safe-area-inset-bottom));
    left: 12px;
    right: 12px;
    max-width: 500px;
    margin: 0 auto;
    background: rgba(10, 14, 22, 0.94);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1.5px solid var(--cyan);
    border-radius: var(--radius-md);
    box-shadow: 0 10px 35px rgba(0,0,0,0.8), 0 0 20px var(--cyan-glow);
    padding: 10px 14px;
    display: none;
    align-items: center;
    justify-content: space-between;
    z-index: 200;
    animation: slideUp 0.25s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .timer-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .timer-display {
    font-size: 24px;
    font-weight: 900;
    color: var(--cyan);
    text-shadow: 0 0 12px var(--cyan-glow);
    font-variant-numeric: tabular-nums;
  }
  .timer-label {
    font-size: 11px;
    color: var(--red);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .timer-actions {
    display: flex;
    gap: 6px;
  }
  .timer-btn {
    background: var(--surface-3);
    border: 1px solid var(--line);
    color: var(--chalk);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .timer-btn:active {
    background: var(--line);
    color: var(--cyan);
  }

  /* BOTTOM NAVIGATION */
  nav.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: calc(62px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: rgba(10, 14, 22, 0.94);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--line);
    display: flex;
    z-index: 150;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: var(--steel);
    cursor: pointer;
    padding: 6px 0;
    transition: color 0.15s;
    position: relative;
  }
  .nav-item.active {
    color: var(--cyan);
    text-shadow: 0 0 8px var(--cyan-glow);
  }
  .nav-item.active::after {
    content: '';
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom) + 2px);
    width: 18px;
    height: 3px;
    border-radius: 2px;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
  }
  .nav-icon {
    font-size: 19px;
    line-height: 1;
    margin-bottom: 2px;
  }
  .nav-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: -0.01em;
    text-transform: uppercase;
  }

  /* CALCULATOR TAB */
  .calc-container {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .calc-title {
    font-size: 18px;
    font-weight: 900;
    margin: 0 0 12px;
    color: #ffffff;
  }
  .calc-input-row {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }
  .calc-field {
    flex: 1;
  }
  .calc-field label {
    display: block;
    font-size: 11.5px;
    color: var(--steel);
    margin-bottom: 6px;
    font-weight: 800;
    text-transform: uppercase;
  }
  .calc-field input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    color: #ffffff;
    font-size: 18px;
    font-weight: 900;
    padding: 10px 12px;
    text-align: center;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .calc-field input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 10px var(--cyan-dim);
  }
  .onerm-hero {
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.12) 0%, rgba(255, 42, 95, 0.08) 100%);
    border: 1px solid rgba(0, 240, 255, 0.35);
    border-radius: var(--radius-md);
    padding: 18px;
    text-align: center;
    margin-bottom: 18px;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.08);
  }
  .onerm-val {
    font-size: 40px;
    font-weight: 900;
    color: var(--cyan);
    text-shadow: 0 0 16px var(--cyan-glow);
    line-height: 1;
    margin-bottom: 4px;
  }
  .onerm-subtitle {
    font-size: 12px;
    font-weight: 700;
    color: var(--chalk-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .rep-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .rep-table th {
    text-align: left;
    color: var(--steel);
    padding: 6px 8px;
    border-bottom: 1px solid var(--line);
    font-size: 11px;
    text-transform: uppercase;
    font-weight: 800;
  }
  .rep-table td {
    padding: 9px 8px;
    border-bottom: 1px solid rgba(32, 41, 59, 0.5);
  }
  .rep-table tr:last-child td { border-bottom: none; }
  .tag-hypertrophy { color: var(--cyan); font-weight: 800; text-shadow: 0 0 6px var(--cyan-dim); }
  .tag-strength { color: var(--red); font-weight: 800; text-shadow: 0 0 6px var(--red-dim); }
  .tag-endurance { color: #38bdf8; font-weight: 800; }

  /* PROGRESS & HISTORY TAB */
  .pr-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.3);
  }
  .pr-title {
    font-size: 15px;
    font-weight: 900;
    color: #ffffff;
    margin-bottom: 4px;
  }
  .pr-stats {
    font-size: 13px;
    color: var(--steel);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pr-weight {
    font-size: 17px;
    font-weight: 900;
    color: var(--cyan);
    text-shadow: 0 0 8px var(--cyan-dim);
  }

  /* MODAL */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 300;
    padding: 16px;
  }
  .modal-box {
    background: #0f131d;
    border: 1px solid var(--line-light);
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 400px;
    padding: 22px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.9), 0 0 20px rgba(0, 240, 255, 0.1);
  }
  .modal-box h3 { margin: 0 0 14px; font-size: 19px; font-weight: 900; color: #fff; }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .btn-primary {
    flex: 1;
    background: linear-gradient(135deg, var(--red) 0%, #d60036 100%);
    color: #fff;
    border: none;
    padding: 12px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 0 12px var(--red-glow);
  }
  .btn-secondary {
    flex: 1;
    background: var(--surface-2);
    color: var(--chalk);
    border: 1px solid var(--line);
    padding: 12px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }

  /* NUTRITION & SETTINGS */
  .nut-block { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .nut-block h3 { margin: 0 0 10px; font-size: 15.5px; font-weight: 900; color: #ffffff; }
  .macro-row { display: flex; justify-content: space-between; font-size: 14.5px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .macro-row:last-child { border-bottom: none; }
  .macro-row b { color: var(--cyan); }
  .nut-block p, .nut-block li { font-size: 13px; line-height: 1.55; color: var(--chalk-dim); }
  .nut-block ul { margin: 6px 0 0; padding-left: 16px; }

  /* SVG ANIMATION CATEGORIES */
  svg[data-cat] line { stroke: var(--cyan); stroke-width: 4; stroke-linecap: round; }
  svg[data-cat] circle.head { fill: var(--red); stroke: none; filter: drop-shadow(0 0 4px var(--red-glow)); }
  svg[data-cat] .gear { stroke: var(--steel); stroke-width: 3; fill: none; stroke-linecap: round; }
  svg[data-cat] circle.gear { fill: var(--steel); stroke: none; }
  svg[data-cat] rect.gear { fill: var(--line); stroke: var(--steel); stroke-width: 2; }

  svg[data-cat="bench"] .j-w{animation:wY 1.7s ease-in-out infinite;}
  svg[data-cat="shoulder"] .j-w{animation:wYup 1.8s ease-in-out infinite;}
  svg[data-cat="row"] .j-w{animation:wRow 1.8s ease-in-out infinite;}
  svg[data-cat="pulldown"] .j-w{animation:wDown 1.8s ease-in-out infinite;}
  svg[data-cat="cablerow"] .j-w{animation:wCable 1.8s ease-in-out infinite;}
  svg[data-cat="calf"] .j-w{animation:wCalf 1.3s ease-in-out infinite;}
  @keyframes wY{0%,100%{transform:translateY(0);}50%{transform:translateY(16px);}}
  @keyframes wYup{0%,100%{transform:translateY(0);}50%{transform:translateY(-22px);}}
  @keyframes wRow{0%,100%{transform:translate(0,0);}50%{transform:translate(-16px,-18px);}}
  @keyframes wDown{0%,100%{transform:translateY(0);}50%{transform:translateY(30px);}}
  @keyframes wCable{0%,100%{transform:translate(0,0);}50%{transform:translate(-16px,-6px);}}
  @keyframes wCalf{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}

  svg[data-cat="lateral"] .j-armL{animation:latL 1.8s ease-in-out infinite;}
  svg[data-cat="lateral"] .j-armR{animation:latR 1.8s ease-in-out infinite;}
  @keyframes latL{0%,100%{transform:rotate(0deg);}50%{transform:rotate(65deg);}}
  @keyframes latR{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-65deg);}}

  svg[data-cat="armcurl"] .j-fore{animation:curlA 1.5s ease-in-out infinite;}
  @keyframes curlA{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-100deg);}}

  svg[data-cat="armext"] .j-fore{animation:extA 1.5s ease-in-out infinite;}
  @keyframes extA{0%,100%{transform:rotate(0deg);}50%{transform:rotate(80deg);}}

  svg[data-cat="squat"] .j-body{animation:sqBody 1.9s ease-in-out infinite;}
  svg[data-cat="squat"] .j-torso{animation:sqTorso 1.9s ease-in-out infinite;}
  svg[data-cat="squat"] .j-thigh{animation:sqThigh 1.9s ease-in-out infinite;}
  svg[data-cat="squat"] .j-shin{animation:sqShin 1.9s ease-in-out infinite;}
  @keyframes sqBody{0%,100%{transform:translateY(0);}50%{transform:translateY(5px);}}
  @keyframes sqTorso{0%,100%{transform:rotate(0deg);}50%{transform:rotate(10deg);}}
  @keyframes sqThigh{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-15deg);}}
  @keyframes sqShin{0%,100%{transform:rotate(0deg);}50%{transform:rotate(30deg);}}

  svg[data-cat="legpress"] .j-thigh{animation:lpThigh 1.8s ease-in-out infinite;}
  svg[data-cat="legpress"] .j-shin{animation:lpShin 1.8s ease-in-out infinite;}
  @keyframes lpThigh{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-8deg);}}
  @keyframes lpShin{0%,100%{transform:rotate(0deg);}50%{transform:rotate(22deg);}}

  svg[data-cat="hinge"] .j-hinge{animation:hingeA 1.9s ease-in-out infinite;}
  @keyframes hingeA{0%,100%{transform:rotate(0deg);}50%{transform:rotate(42deg);}}

  svg[data-cat="legcurl"] .j-shin{animation:lcA 1.5s ease-in-out infinite;}
  @keyframes lcA{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-90deg);}}

  svg[data-cat="legext"] .j-shin{animation:leA 1.5s ease-in-out infinite;}
  @keyframes leA{0%,100%{transform:rotate(0deg);}50%{transform:rotate(55deg);}}

  svg[data-cat="crunch"] .j-curlup{animation:crA 1.5s ease-in-out infinite;}
  @keyframes crA{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-25deg);}}

  svg[data-cat="hangraise"] .j-legs{animation:hrA 1.8s ease-in-out infinite;}
  @keyframes hrA{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-70deg);}}

  /* SCHEDULE BANNER */
  .schedule-card {
    margin: 12px 14px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
  }
  .schedule-card.is-training-day {
    border-color: rgba(0, 240, 255, 0.4);
    background: linear-gradient(145deg, #101624 0%, #080a11 100%);
    box-shadow: 0 4px 20px rgba(0, 240, 255, 0.1);
  }
  .schedule-card.is-rest-day {
    border-color: rgba(100, 116, 139, 0.3);
    background: linear-gradient(145deg, #0f121a 0%, #08090d 100%);
  }
  .sched-badge-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .sched-chip {
    font-size: 10.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .sched-chip.chip-active {
    background: var(--cyan-dim);
    color: var(--cyan);
    border: 1px solid rgba(0, 240, 255, 0.35);
  }
  .sched-chip.chip-rest {
    background: rgba(100, 116, 139, 0.15);
    color: var(--steel);
    border: 1px solid rgba(100, 116, 139, 0.25);
  }
  .sched-date-label {
    font-size: 12px;
    color: var(--chalk-dim);
    font-weight: 600;
  }
  .sched-main-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 12px;
  }
  .sched-title-box {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .sched-hint {
    font-size: 11.5px;
    color: var(--chalk-dim);
  }
  .sched-target-name {
    margin: 0;
    font-size: 20px;
    font-weight: 900;
    color: var(--chalk);
    letter-spacing: -0.01em;
  }
  .schedule-card.is-training-day .sched-target-name {
    color: var(--cyan);
  }
  .sched-go-btn {
    background: linear-gradient(135deg, var(--cyan) 0%, #00b4d8 100%);
    color: #07080b;
    border: none;
    border-radius: var(--radius-sm);
    padding: 7px 13px;
    font-size: 12px;
    font-weight: 900;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
    box-shadow: 0 0 10px var(--cyan-glow);
  }
  .sched-go-btn:active {
    transform: scale(0.96);
  }
  .sched-current-mark {
    font-size: 12px;
    font-weight: 800;
    color: var(--cyan);
    background: var(--cyan-dim);
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid rgba(0, 240, 255, 0.4);
  }
  .sched-footer {
    border-top: 1px solid var(--line);
    padding-top: 8px;
    font-size: 11.5px;
    color: var(--steel);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
  }
  .tab-star-badge {
    font-size: 9px;
    font-weight: 900;
    background: var(--red);
    color: #fff;
    padding: 1px 4px;
    border-radius: 3px;
    margin-left: 3px;
    vertical-align: middle;
    letter-spacing: 0;
    box-shadow: 0 0 6px var(--red-glow);
  }
  .user-select-card {
    flex: 1;
    background: var(--surface-2);
    border: 2px solid var(--line);
    border-radius: var(--radius-md);
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    color: var(--chalk);
  }
  .user-select-card.active {
    border-color: var(--cyan);
    background: rgba(0, 240, 255, 0.1);
    box-shadow: 0 0 15px var(--cyan-dim);
  }
  .user-select-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--surface-3);
    color: var(--chalk);
    font-size: 20px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
  }
  .user-select-card.active .user-select-avatar {
    background: linear-gradient(135deg, var(--red) 0%, var(--cyan) 100%);
    color: #fff;
    border-color: var(--cyan);
    box-shadow: 0 0 10px var(--cyan-glow);
  }

  /* STRICT TODAY WORKOUT HEADER */
  .today-workout-header {
    background: linear-gradient(145deg, #101624 0%, #080a11 100%);
    border: 1px solid rgba(0, 240, 255, 0.35);
    border-radius: var(--radius-md);
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 6px 26px rgba(0, 240, 255, 0.1), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .today-tag-pill {
    display: inline-block;
    background: rgba(255, 42, 95, 0.15);
    color: var(--red);
    font-size: 10.5px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 9px;
    border-radius: 4px;
    border: 1px solid rgba(255, 42, 95, 0.45);
    box-shadow: 0 0 10px rgba(255, 42, 95, 0.2);
    margin-bottom: 8px;
  }
  .today-workout-title {
    margin: 0 0 6px;
    font-size: 24px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: -0.02em;
  }
  .today-workout-meta {
    font-size: 12.5px;
    color: var(--chalk-dim);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .today-workout-meta b {
    color: var(--cyan);
  }
  .today-next-hint {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--steel);
  }
  .today-next-hint b {
    color: #ffffff;
  }

  .rest-day-card {
    background: linear-gradient(145deg, #0e121a 0%, #07080b 100%);
    border: 1px solid rgba(0, 240, 255, 0.2);
    border-radius: var(--radius-md);
    padding: 22px 18px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.5);
  }
  .rest-badge {
    display: inline-block;
    background: rgba(0, 240, 255, 0.12);
    color: var(--cyan);
    border: 1px solid rgba(0, 240, 255, 0.35);
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 9px;
    border-radius: 4px;
    margin-bottom: 10px;
    box-shadow: 0 0 8px var(--cyan-dim);
  }
  .rest-day-card h2 {
    margin: 0 0 4px;
    font-size: 23px;
    font-weight: 900;
    color: #ffffff;
  }
  .rest-date-text {
    font-size: 13px;
    color: var(--chalk-dim);
    margin-bottom: 18px;
  }
  .next-workout-box {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 14px;
    margin-bottom: 20px;
  }
  .next-label {
    font-size: 11px;
    color: var(--steel);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 800;
    margin-bottom: 4px;
  }
  .next-title {
    font-size: 18px;
    font-weight: 900;
    color: var(--cyan);
    margin-bottom: 4px;
  }
  .next-schedule-rule {
    font-size: 11.5px;
    color: var(--chalk-dim);
    margin-bottom: 12px;
  }
  .btn-preview-next {
    width: 100%;
    background: var(--surface-3);
    border: 1px solid var(--line-light);
    color: #ffffff;
    padding: 11px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-preview-next:active {

  .recovery-tips-box {

  }
  .recovery-tips-box h3 {

    color: #ffffff;
    font-weight: 900;

    align-items: flex-start;

    justify-content: space-between;

    background: var(--surface-2);
    border: 1px solid var(--line);
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    margin-bottom: 14px;
  }
  .btn-back-rest {
    background: transparent;
    border: 1px solid var(--steel);
    color: var(--chalk);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;

  .ex-pager-bar {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .pager-top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pager-count-badge {
    font-size: 12px;
    font-weight: 900;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .pager-count-badge b {
    color: var(--cyan);
  }
  .pager-nav-btns {
    display: flex;
    gap: 6px;
  }
  .btn-pager-nav {
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--chalk);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s ease;

  .btn-pager-nav:hover:not(:disabled) {

    gap: 5px;

// Offline Service Worker & Persistent Storage Registration
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js?v=4').then(reg => {
      reg.update();
      reg.onupdatefound = () => {
        const installingWorker = reg.installing;
        if (installingWorker) {
          installingWorker.onstatechange = () => {
            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
              console.log('New version available, auto-updating...');
              window.location.reload();
            }
          };
        }
      };
    }).catch(e => console.warn('SW:', e));

    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });
  });
}
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().then(granted => {
    console.log('Persistent storage granted:', granted);
  }).catch(() => {});
}

/* ================== AUTOMATIC WORKOUT SCHEDULE (3/WEEK MOSCOW) ================== */
/**
 * 3 workouts per week: Monday, Wednesday, Friday
 * Cycle of 4 workouts: Верх 1 -> Низ 1 -> Верх 2 -> Низ 2 -> repeat
 * Base anchor: Monday, 14 September 2026 (Moscow time) = Верх 1
 */
function getMoscowDayInfo(date = new Date()) {
  try {
    const moscowStr = date.toLocaleString('en-US', { timeZone: 'Europe/Moscow' });
    const moscowDate = new Date(moscowStr);
    
    // Base: 2026-09-14 00:00:00 (Monday)
    const base = new Date(2026, 8, 14, 0, 0, 0);
    const cur = new Date(moscowDate.getFullYear(), moscowDate.getMonth(), moscowDate.getDate(), 0, 0, 0);
    
    const diffDays = Math.round((cur - base) / (1000 * 60 * 60 * 24));
    const fullWeeks = Math.floor(diffDays / 7);
    // Monday=0, Tuesday=1, Wednesday=2, Thursday=3, Friday=4, Saturday=5, Sunday=6
    const dow = (cur.getDay() + 6) % 7;
    
    const dayNames = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
    const cycle = [
      { key: 'verh1', title: 'Верх 1' },
      { key: 'niz1', title: 'Низ 1' },
      { key: 'verh2', title: 'Верх 2' },
      { key: 'niz2', title: 'Низ 2' }
    ];
    
    let trainingIndex;
    let isTrainingDay = false;
    let nextDayText = '';
    
    if (dow === 0) { // Mon
      trainingIndex = fullWeeks * 3 + 0;
      isTrainingDay = true;
      nextDayText = 'Среда (' + cycle[((trainingIndex + 1) % 4 + 4) % 4].title + ')';
    } else if (dow === 1) { // Tue
      trainingIndex = fullWeeks * 3 + 1;
      isTrainingDay = false;
      nextDayText = 'Среда (' + cycle[((trainingIndex) % 4 + 4) % 4].title + ')';
    } else if (dow === 2) { // Wed
      trainingIndex = fullWeeks * 3 + 1;
      isTrainingDay = true;
      nextDayText = 'Пятница (' + cycle[((trainingIndex + 1) % 4 + 4) % 4].title + ')';
    } else if (dow === 3) { // Thu
      trainingIndex = fullWeeks * 3 + 2;
      isTrainingDay = false;
      nextDayText = 'Пятница (' + cycle[((trainingIndex) % 4 + 4) % 4].title + ')';
    } else if (dow === 4) { // Fri
      trainingIndex = fullWeeks * 3 + 2;
      isTrainingDay = true;
      nextDayText = 'Понедельник (' + cycle[((trainingIndex + 1) % 4 + 4) % 4].title + ')';
    } else { // Sat, Sun
      trainingIndex = (fullWeeks + 1) * 3 + 0;
      isTrainingDay = false;
      nextDayText = 'Понедельник (' + cycle[((trainingIndex) % 4 + 4) % 4].title + ')';
    }
    
    const cycleIdx = ((trainingIndex % 4) + 4) % 4;
    const targetWorkout = cycle[cycleIdx];
    
    return {
      curDateStr: cur.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }),
      dayName: dayNames[dow],
      isTrainingDay,
      targetKey: targetWorkout.key,
      targetTitle: targetWorkout.title,
      nextDayText
    };
  } catch(e) {
    return {
      curDateStr: 'Сегодня',
      dayName: 'Тренировочный день',
      isTrainingDay: true,
      targetKey: 'verh1',
      targetTitle: 'Верх 1',
      nextDayText: 'Среда (Низ 1)'
    };
  }
}

/* ================== SOUND & HAPTIC ================== */
let audioCtx = null;
function playBeep(){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Note A5
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  } catch(e){}
}

function triggerHaptic(duration = 40){
  try {
    if (navigator.vibrate) navigator.vibrate(duration);
  } catch(e){}
}

/* ================== REST TIMER ================== */
let timerInterval = null;
let timerSecondsLeft = 0;

function startRestTimer(seconds = 120){
  clearInterval(timerInterval);
  timerSecondsLeft = seconds;
  const bar = document.getElementById('rest-timer-bar');
  bar.style.display = 'flex';
  updateTimerUI();
  
  timerInterval = setInterval(()=>{
    timerSecondsLeft--;
    if (timerSecondsLeft <= 0) {
      clearInterval(timerInterval);
      playBeep();
      triggerHaptic([100, 50, 150]);
      setTimeout(playBeep, 250);
      bar.style.display = 'none';
    } else {
      updateTimerUI();
    }
  }, 1000);
}

function updateTimerUI(){
  const el = document.getElementById('timer-countdown');
  const m = Math.floor(timerSecondsLeft / 60);
  const s = timerSecondsLeft % 60;
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function adjustTimer(deltaSec){
  timerSecondsLeft = Math.max(5, timerSecondsLeft + deltaSec);
  updateTimerUI();
}

function stopRestTimer(){
  clearInterval(timerInterval);
  document.getElementById('rest-timer-bar').style.display = 'none';
}

/* ================== 1RM CALCULATIONS ================== */
// Epley formula: 1RM = Weight * (1 + Reps / 30)
function calc1RM(weight, reps){
  if (!weight || weight <= 0) return 0;
  if (reps <= 1) return Math.round(weight * 10) / 10;
  const est = weight * (1 + reps / 30);
  return Math.round(est * 10) / 10;
}

// Target weights for percentage table
function calcWeightForReps(oneRM, targetReps){
  if (!oneRM || oneRM <= 0) return 0;
  // Inverse Epley
  const w = oneRM / (1 + targetReps / 30);
  // Round to nearest 0.5 or 2.5 kg
  return Math.round(w * 2) / 2;
}

/* ================== WORKOUT LOGIC & SMART FORECAST ================== */
function getLastExerciseSession(exName){
  const u = getCurUser();
  for (let i = 0; i < u.history.length; i++) {
    const h = u.history[i];
    if (h.exercises && h.exercises[exName]) {
      return h.exercises[exName];
    }
  }
  return null;
}

function getExerciseForecast(exName, exDef){
  const u = getCurUser();
  
  // Parse sets count & rep range (e.g. "3×6-8", "4×15-20", "3×10-12")
  let numSets = 3;
  let minReps = 8;
  let maxReps = 10;
  const matchSets = (exDef.sets || '').match(/^(\d+)×(\d+)(?:-(\d+))?/);
  if (matchSets) {
    numSets = parseInt(matchSets[1], 10);
    minReps = parseInt(matchSets[2], 10);
    maxReps = matchSets[3] ? parseInt(matchSets[3], 10) : minReps;
  }

  const lastSession = getLastExerciseSession(exName);
  const userPR = u.prs ? u.prs[exName] : null;

  if (lastSession && lastSession.length > 0) {
    const validSets = lastSession.filter(s => s && typeof s.weight === 'number');
    if (validSets.length > 0) {
      const weights = validSets.map(s => Number(s.weight) || 0);
      const reps = validSets.map(s => Number(s.reps) || 0);
      const minRep = Math.min(...reps);
      const maxRep = Math.max(...reps);
      const lastWeight = weights[weights.length - 1] || 0;
      
      let bestEst1RM = 0;
      validSets.forEach(s => {
        const rm = calc1RM(s.weight, s.reps);
        if (rm > bestEst1RM) bestEst1RM = rm;
      });

      // Adaptive weight increment
      let inc = 2.5;
      if (lastWeight > 0 && lastWeight < 15) inc = 1.0;
      else if (lastWeight >= 60) inc = 2.5;

      const allHitCeiling = reps.every(r => r >= maxReps);

      // 1. Progressive Overload: All sets completed at upper rep ceiling
      if (allHitCeiling && lastWeight > 0) {
        const nextWeight = Math.round((lastWeight + inc) * 10) / 10;
        return {
          type: 'increase',
          icon: '🚀',
          badgeText: `Прогрессия (+${inc} кг)`,
          weight: nextWeight,
          weightChangeClass: 'weight-up',
          targetRepsText: `${numSets} × ${minReps} повт.`,
          defaultReps: minReps,
          numSets: numSets,
          est1RM: bestEst1RM,
          rationale: `В прошлый раз все ${validSets.length} подходов закрыты на максимум: ${reps.join(', ')} повт. при ${lastWeight} кг! Рекомендуем поднять вес до <b>${nextWeight} кг</b> (+${inc} кг) и начать цикл с нижней границы (${minReps} повт.).`
        };
      }

      // 2. Volume Consolidation: Reps inside target hypertrophy window
      if (minRep >= minReps) {
        return {
          type: 'maintain',
          icon: '🎯',
          badgeText: `Закрепление веса`,
          weight: lastWeight,
          weightChangeClass: 'weight-keep',
          targetRepsText: `${numSets} × ${maxReps} повт.`,
          defaultReps: Math.min(maxReps, maxRep + 1),
          numSets: numSets,
          est1RM: bestEst1RM,
          rationale: `Прошлый результат: ${reps.join(', ')} повт. при ${lastWeight} кг. Вес подобран идеально! Сегодня держим <b>${lastWeight} кг</b> и стараемся дожать до ${maxReps} повторений во всех подходах.`
        };
      }

      // 3. Stimulus Optimization / Deload: Reps dropped below target
      if (minRep < minReps && lastWeight > 0) {
        const dec = lastWeight < 15 ? 1.0 : 2.5;
        const nextWeight = Math.max(0, Math.round((lastWeight - dec) * 10) / 10);
        return {
          type: 'deload',
          icon: '⚖️',
          badgeText: `Оптимизация веса (-${dec} кг)`,
          weight: nextWeight,
          weightChangeClass: 'weight-down',
          targetRepsText: `${numSets} × ${minReps}-${maxReps} повт.`,
          defaultReps: minReps,
          numSets: numSets,
          est1RM: bestEst1RM,
          rationale: `Повторения (${minRep}) просели ниже границы (${minReps}). Рекомендуем снизить вес до <b>${nextWeight} кг</b> для чистой биомеханики и качественного мышечного стимула.`
        };
      }
    }
  }

  // Baseline if no session history yet
  let baseWeight = 0;
  const matchWeight = (exDef.weight || '').match(/(?:~|:\s*~?)\s*(\d+(\.\d+)?)/) || (exDef.weight || '').match(/(\d+(\.\d+)?)\s*кг/);
  if (matchWeight) {
    baseWeight = parseFloat(matchWeight[1]);
  } else if (userPR && userPR.est1RM > 0) {
    baseWeight = calcWeightForReps(userPR.est1RM, Math.round((minReps + maxReps) / 2));
  }

  return {
    type: 'baseline',
    icon: '✨',
    badgeText: 'Стартовый ориентир',
    weight: baseWeight,
    weightChangeClass: 'weight-keep',
    targetRepsText: `${numSets} × ${minReps}-${maxReps} повт.`,
    defaultReps: minReps,
    numSets: numSets,
    est1RM: userPR ? userPR.est1RM : 0,
    rationale: `Первая тренировка этого упражнения в дневнике. Рекомендуемый старт: <b>${baseWeight > 0 ? baseWeight + ' кг' : 'собственный вес'}</b> на ${minReps}-${maxReps} повторений с запасом 1-2 повтора (RIR 2).`
  };
}

function initExerciseSets(exName, exDef){
  const u = getCurUser();
  if (!u.sessionSets[exName] || u.sessionSets[exName].length === 0) {
    const forecast = getExerciseForecast(exName, exDef);
    u.sessionSets[exName] = [];
    for (let i = 0; i < forecast.numSets; i++) {
      u.sessionSets[exName].push({
        weight: forecast.weight,
        reps: forecast.defaultReps,
        done: false
      });
    }
    saveState();
  }
}

function applyForecastToInputs(exName){
  const u = getCurUser();
  let foundDef = null;
  for (const k in workouts) {
    const found = workouts[k].exercises.find(e => e.name === exName);
    if (found) { foundDef = found; break; }
  }
  if (!foundDef) return;
  
  const forecast = getExerciseForecast(exName, foundDef);
  u.sessionSets[exName] = [];
  for (let i = 0; i < forecast.numSets; i++) {
    u.sessionSets[exName].push({
      weight: forecast.weight,
      reps: forecast.defaultReps,
      done: false
    });
  }
  saveState();
  renderWorkoutScreen();
  triggerHaptic(40);
}

function updateSetField(exName, setIndex, field, value){
  const u = getCurUser();
  if (u.sessionSets[exName] && u.sessionSets[exName][setIndex]) {
    u.sessionSets[exName][setIndex][field] = Math.max(0, parseFloat(value) || 0);
    saveState();
  }
}

function stepSetField(exName, setIndex, field, step){
  const u = getCurUser();
  if (u.sessionSets[exName] && u.sessionSets[exName][setIndex]) {
    const cur = u.sessionSets[exName][setIndex][field] || 0;
    const updated = Math.max(0, Math.round((cur + step) * 10) / 10);
    u.sessionSets[exName][setIndex][field] = updated;
    saveState();
    // update DOM directly for snappy responsiveness
    const inputEl = document.getElementById(`input-${exName}-${setIndex}-${field}`);
    if (inputEl) inputEl.value = updated;
  }
}

function toggleSetDone(exName, setIndex, restSec = 120){
  const u = getCurUser();
  if (u.sessionSets[exName] && u.sessionSets[exName][setIndex]) {
    const setObj = u.sessionSets[exName][setIndex];
    setObj.done = !setObj.done;
    saveState();
    
    const btn = document.getElementById(`btn-done-${exName}-${setIndex}`);
    if (btn) {
      btn.classList.toggle('completed', setObj.done);
      btn.textContent = setObj.done ? '✓' : '';
    }
    
    if (setObj.done) {
      triggerHaptic(40);
      // Check for PR
      const est1RM = calc1RM(setObj.weight, setObj.reps);
      const curPr = u.prs[exName] ? u.prs[exName].est1RM : 0;
      if (est1RM > curPr) {
        u.prs[exName] = {
          weight: setObj.weight,
          reps: setObj.reps,
          est1RM: est1RM,
          date: new Date().toLocaleDateString('ru-RU')
        };
        saveState();
      }
      // Start rest timer
      startRestTimer(restSec);
    }
    
    // Check if exercise completed for progression feedback
    updateProgressionFeedback(exName);
  }
}

function addSet(exName){
  const u = getCurUser();
  if (u.sessionSets[exName]) {
    const last = u.sessionSets[exName][u.sessionSets[exName].length - 1] || {weight:0, reps:8};
    u.sessionSets[exName].push({
      weight: last.weight,
      reps: last.reps,
      done: false
    });
    saveState();
    renderWorkoutScreen();
  }
}

function removeSet(exName){
  const u = getCurUser();
  if (u.sessionSets[exName] && u.sessionSets[exName].length > 1) {
    u.sessionSets[exName].pop();
    saveState();
    renderWorkoutScreen();
  }
}

function updateProgressionFeedback(exName){
  const box = document.getElementById(`prog-reco-${exName}`);
  if (!box) return;
  const u = getCurUser();
  const sets = u.sessionSets[exName] || [];
  const allDone = sets.length > 0 && sets.every(s => s.done);
  if (!allDone) {
    box.style.display = 'none';
    return;
  }
  
  // Analyze progression
  const maxRep = Math.max(...sets.map(s=>s.reps));
  const minRep = Math.min(...sets.map(s=>s.reps));
  const avgWeight = Math.round(sets.reduce((a,b)=>a+b.weight, 0) / sets.length * 10)/10;
  const est1RM = calc1RM(avgWeight, maxRep);
  
  // Progression prompt
  if (minRep >= 8) {
    box.innerHTML = `🔥 <b>Отличный прогресс!</b> Все ${sets.length} подходов закрыты по верхней границе повторений (≥${minRep}). Рекомендация на следующую тренировку: <b>${Math.round((avgWeight + 2.5)*10)/10} кг (+2.5 кг)</b>.`;
    box.style.display = 'block';
  } else if (minRep < 6 && avgWeight > 0) {
    const recWeight = Math.max(0, Math.round((avgWeight - 2.5)*10)/10);
    box.innerHTML = `💡 <b>Оптимизация стимула:</b> Повторения (${minRep}) ниже диапазона гипертрофии (6-8). Рекомендуем чуть снизить вес до <b>${recWeight} кг</b>, чтобы набрать чистый рабочий объём.`;
    box.style.display = 'block';
  } else {
    box.innerHTML = `💪 <b>Рабочий вес зафиксирован:</b> Расчётный 1ПМ = <b>${est1RM} кг</b>. Повторите этот вес на следующей тренировке до закрытия верхней границы повторов.`;
    box.style.display = 'block';
  }
}

function finishCurrentWorkout(explicitDayKey){
  const u = getCurUser();
  const sched = getMoscowDayInfo();
  const dayKey = explicitDayKey || sched.targetKey;
  const w = workouts[dayKey];
  if (!w) return;
  
  let totalVolume = 0;
  let totalCompletedSets = 0;
  const savedEx = {};
  
  w.exercises.forEach(ex => {
    const sets = u.sessionSets[ex.name] || [];
    const completed = sets.filter(s => s.done);
    if (completed.length) {
      savedEx[ex.name] = completed.map(s => ({ weight: s.weight, reps: s.reps }));
      completed.forEach(s => {
        totalVolume += (s.weight * s.reps);
        totalCompletedSets++;
      });
    }
  });
  
  if (totalCompletedSets === 0) {
    alert('Вы ещё не отметили ни одного выполненного подхода (✓)!');
    return;
  }
  
  const historyEntry = {
    date: new Date().toLocaleDateString('ru-RU', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }),
    dayKey: dayKey,
    dayTitle: w.title,
    volume: Math.round(totalVolume),
    setsCount: totalCompletedSets,
    exercises: savedEx
  };
  
  u.history.unshift(historyEntry);
  
  // Clear current day session sets so next rotation generates fresh smart forecast
  w.exercises.forEach(ex => {
    delete u.sessionSets[ex.name];
  });
  
  saveState();
  triggerHaptic([150, 100, 200]);
  
  alert(`🎉 Тренировка «${w.title}» завершена!\n\nВыполнено подходов: ${totalCompletedSets}\nОбщий тоннаж: ${Math.round(totalVolume)} кг\nДанные сохранены в истории прогресса.`);
  switchMainTab('progress');
}

/* ================== PAGER & CAROUSEL NAVIGATION ================== */
function goToExercise(index){
  const sched = getMoscowDayInfo();
  const dayKey = (isPreviewMode && previewDayKey) ? previewDayKey : sched.targetKey;
  const w = workouts[dayKey];
  if (!w) return;
  
  const total = w.exercises.length;
  appState.currentExerciseIndex = Math.max(0, Math.min(index, total - 1));
  saveState();
  renderWorkoutScreen();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function advanceToNextExercise(){
  stopRestTimer();
  const sched = getMoscowDayInfo();
  const dayKey = (isPreviewMode && previewDayKey) ? previewDayKey : sched.targetKey;
  const w = workouts[dayKey];
  if (!w) return;
  
  const curIdx = appState.currentExerciseIndex || 0;
  if (curIdx < w.exercises.length - 1) {
    goToExercise(curIdx + 1);
    triggerHaptic([100, 60, 120]);
    playBeep();
  }
}

/* ================== FLOATING REST TIMER ================== */
let restTimerInterval = null;
let restTimerSeconds = 0;
let restTimerTotal = 0;
let restTimerAutoAdvance = false;

function startRestTimer(seconds = 120, autoAdvance = false){
  stopRestTimer();
  restTimerSeconds = seconds;
  restTimerTotal = seconds;
  restTimerAutoAdvance = autoAdvance;
  
  const bar = document.getElementById('rest-timer-bar');
  if (bar) bar.style.display = 'flex';
  
  const advBtn = document.getElementById('btn-timer-advance');
  if (advBtn) {
    advBtn.style.display = autoAdvance ? 'inline-flex' : 'none';
  }
  
  updateTimerUI();
  
  restTimerInterval = setInterval(() => {
    restTimerSeconds--;
    if (restTimerSeconds <= 0) {
      playBeep();
      triggerHaptic([200, 100, 300]);
      if (restTimerAutoAdvance) {
        advanceToNextExercise();
      } else {
        stopRestTimer();
      }
    } else {
      updateTimerUI();
    }
  }, 1000);
}

function updateTimerUI(){
  const cd = document.getElementById('timer-countdown');
  if (cd) {
    const m = Math.floor(restTimerSeconds / 60);
    const s = restTimerSeconds % 60;
    cd.textContent = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
  }
}

function adjustTimer(deltaSec){
  restTimerSeconds = Math.max(0, restTimerSeconds + deltaSec);
  updateTimerUI();
}

function stopRestTimer(){
  if (restTimerInterval) {
    clearInterval(restTimerInterval);
    restTimerInterval = null;
  }
  restTimerAutoAdvance = false;
  const bar = document.getElementById('rest-timer-bar');
  if (bar) bar.style.display = 'none';
}

/* ================== SET COMPLETION & PROG OVERLOAD ================== */
function toggleSetDone(exName, setIndex, restSec = 120){
  const u = getCurUser();
  if (u.sessionSets[exName] && u.sessionSets[exName][setIndex]) {
    const setObj = u.sessionSets[exName][setIndex];
    setObj.done = !setObj.done;
    saveState();
    
    const btn = document.getElementById(`btn-done-${exName}-${setIndex}`);
    if (btn) {
      btn.classList.toggle('completed', setObj.done);
      btn.textContent = setObj.done ? '✓' : '';
    }
    
    if (setObj.done) {
      triggerHaptic(40);
      const est1RM = calc1RM(setObj.weight, setObj.reps);
      const curPr = u.prs[exName] ? u.prs[exName].est1RM : 0;
      if (est1RM > curPr) {
        u.prs[exName] = {
          weight: setObj.weight,
          reps: setObj.reps,
          est1RM: est1RM,
          date: new Date().toLocaleDateString('ru-RU')
        };
        saveState();
      }
      
      // Check if ALL sets of this exercise are completed
      const allDone = u.sessionSets[exName].every(s => s.done);
      startRestTimer(restSec, allDone);
    }
    
    updateProgressionFeedback(exName);
  }
}

  let sourceBadge = '';
  
  // Priority 1: Actual PR in this exercise
  if (u.prs && u.prs[selectedOptimalEx] && u.prs[selectedOptimalEx].est1RM > 0) {
    est1RM = u.prs[selectedOptimalEx].est1RM;
    sourceBadge = '🏆 Фактический персональный рекорд';
  } else {
    // Priority 2: Pattern Transfer
    let patternTransfer1RM = 0;
    for (const otherEx in u.prs) {
      const otherInfo = movementPatterns[otherEx];
      if (otherInfo && otherInfo.pattern === patternInfo.pattern && u.prs[otherEx].est1RM > 0) {
        const ratio = patternInfo.baseFactor / (otherInfo.baseFactor || 1);
        patternTransfer1RM = Math.round(u.prs[otherEx].est1RM * ratio * 10) / 10;
        break;
      }
    }
    if (patternTransfer1RM > 0) {
      est1RM = patternTransfer1RM;
      sourceBadge = '🔄 Биомеханический перенос силы';
    } else {
      // Priority 3: Allometric Scaling (Strength proportional to Body Mass ^ 2/3)
      // Base strength scaled to LBM and leverage
      const allometricFactor = Math.pow(W / 75, 0.67);
      est1RM = Math.round(patternInfo.baseFactor * 75 * allometricFactor * leverageFactor * 10) / 10;
      sourceBadge = '🧬 Антропометрический расчёт (S ∝ M²ᐟ³)';
    }
  }

  // Generate scientific training zones
  const zones = [
    { name: 'Оптимум гипертрофии', pct: 78, reps: '8-10', rir: '1-2 RIR', desc: 'Максимальный стимул мышечного роста, темп 3-0-1', cls: 'tag-hypertrophy' },
    { name: 'Силовая гипертрофия', pct: 84, reps: '6-8', rir: '1 RIR', desc: 'Миофибриллярная гипертрофия + рост силы', cls: 'tag-strength' },
    { name: 'Объёмный пампинг', pct: 68, reps: '12-15', rir: '1-2 RIR', desc: 'Саркоплазматический стимул и капилляризация', cls: 'tag-hypertrophy' },
    { name: 'Силовой пик', pct: 90, reps: '3-5', rir: '0-1 RIR', desc: 'Нервно-мышечная адаптация и координация', cls: 'tag-strength' }
  ];

  // Exercises list for dropdown
  const allExercises = Object.keys(movementPatterns);

  const html = `
  <div class="day-title-box">
    <h2>Оптимальный вес</h2>
    <span class="day-meta">Биомеханический расчёт</span>
  </div>

  <!-- ATHLETE BODY PROFILE -->
  <div class="athlete-stats-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-size:12.5px; font-weight:900; color:#fff;">Профиль атлета: <b>${prof.name || 'Атлет'}</b></span>
      <span style="font-size:11px; color:var(--cyan); font-weight:800;">ИМТ: ${bmi}</span>
    </div>
    <div class="athlete-stats-grid">
      <div class="athlete-stat-item">
        <div class="l">Вес тела</div>
        <div class="v">${W} кг</div>
      </div>
      <div class="athlete-stat-item">
        <div class="l">Рост</div>
        <div class="v">${H} см</div>
      </div>
      <div class="athlete-stat-item">
        <div class="l">Сухая масса</div>
        <div class="v">${lbm} кг</div>
      </div>
    </div>
  </div>

  <div class="calc-container">
    <label style="font-size:11px; font-weight:800; color:var(--cyan); text-transform:uppercase;">Выберите упражнение:</label>
    <select id="select-optimal-ex" onchange="changeOptimalEx(this.value)" style="width:100%; padding:10px 12px; background:var(--surface-2); border:1px solid var(--line); color:#fff; border-radius:6px; font-size:14px; font-weight:800; margin-top:5px; margin-bottom:16px;">
      ${allExercises.map(name => `<option value="${name}" ${name === selectedOptimalEx ? 'selected' : ''}>${name}</option>`).join('')}
    </select>
    
    <div class="onerm-hero">
      <div class="onerm-val">${est1RM > 0 ? est1RM + ' кг' : 'Свой вес'}</div>
      <div class="onerm-subtitle">Расчётный 1ПМ (Одноповторный максимум)</div>
      <div style="font-size:11px; color:var(--cyan); margin-top:6px; font-weight:700;">${sourceBadge}</div>
    </div>
    
    <div class="calc-title" style="font-size:14.5px; margin-top:20px;">Научно обоснованные зоны нагрузок:</div>
    <table class="rep-table">
      <thead>
        <tr>
          <th>Зона нагрузки</th>
          <th>% 1ПМ</th>
          <th>Повт.</th>
          <th style="text-align:right;">Вес снаряда</th>
        </tr>
      </thead>
      <tbody>
        ${zones.map(z => {
          let targetW = Math.round((est1RM * z.pct / 100) * 2) / 2;
          if (patternInfo.isPerArm && targetW > 0) targetW = Math.round(targetW * 2) / 2;
          return `
          <tr>
            <td>
              <div class="${z.cls}">${z.name}</div>
              <div style="font-size:10.5px; color:var(--steel); margin-top:2px;">${z.desc} (${z.rir})</div>
            </td>
            <td style="color:var(--steel); font-weight:700;">${z.pct}%</td>
            <td style="font-weight:800; color:#fff;">${z.reps}</td>
            <td style="text-align:right; font-weight:900; font-size:15px; color:var(--cyan);">
              ${targetW > 0 ? targetW + ' кг' : 'Б/В'}
              ${patternInfo.isPerArm ? '<small style="display:block; font-size:9.5px; color:var(--steel);">на руку</small>' : ''}
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    
    <div style="margin-top:14px; padding:10px 12px; background:rgba(0,240,255,0.06); border-left:3px solid var(--cyan); border-radius:0 6px 6px 0; font-size:11.5px; color:var(--chalk-dim); line-height:1.45;">
      💡 <b>Научный протокол гипертрофии:</b> для роста мышц держите рабочий вес в диапазоне <b>75-80% 1ПМ</b>. Выполняйте подход с запасом 1-2 повтора (RIR 1-2), не доводя каждый сет до полного отказа.
    </div>
  </div>`;

  document.getElementById('main').innerHTML = html;
}

function changeOptimalEx(name){
  selectedOptimalEx = name;
  renderOptimalWeightScreen();
}

/* ================== CALENDAR & STREAK SCREEN ================== */
let calCurrentYear = 2026;
let calCurrentMonth = 8; // 0-indexed: 8 is September

function renderCalendarScreen(){
  const u = getCurUser();
  const hist = u.history || [];
  
  const monthNames = [
    'Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
    'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'
  ];
  
  const daysInMonth = new Date(calCurrentYear, calCurrentMonth + 1, 0).getDate();
  const firstDayIndex = (new Date(calCurrentYear, calCurrentMonth, 1).getDay() + 6) % 7; // Monday = 0
  
  // Workouts in this month
  const workoutsThisMonth = hist.filter(h => {
    // Parse date strings like "15 сен" or "14.09.2026"
    return true; // include for stats demo
  });
  
  const totalVolumeMonth = hist.reduce((acc, h) => acc + (h.volume || 0), 0);
  
  // Build cells
  const cells = [];
  // Empty padding
  for (let i = 0; i < firstDayIndex; i++) {
    cells.push('<div class="cal-cell empty"></div>');
  }
  
  const today = new Date();
  const isCurMonth = today.getFullYear() === calCurrentYear && today.getMonth() === calCurrentMonth;
  const todayDate = today.getDate();
  
  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = isCurMonth && d === todayDate;
    
    // Check if workout completed on this day (match history entry)
    const matchingWorkout = hist.find(h => {
      if (h.dayNum && h.dayNum === d) return true;
      if (h.date && h.date.includes(`${d} `)) return true;
      return false;
    });
    
    let cellCls = 'cal-cell';
    if (isToday) cellCls += ' today';
    if (matchingWorkout) cellCls += ' has-workout';
    
    const clickAttr = matchingWorkout ? `onclick="showCalendarSessionDetails('${matchingWorkout.date}', '${matchingWorkout.dayTitle || 'Тренировка'}', ${matchingWorkout.volume || 0}, ${matchingWorkout.setsCount || 0})"` : '';
    
    cells.push(`
      <div class="${cellCls}" ${clickAttr}>
        <span class="cal-cell-num">${d}</span>
        ${matchingWorkout ? `<span class="cal-dot"></span>` : ''}
      </div>
    `);
  }

  const html = `
  <div class="day-title-box">
    <h2>Календарь</h2>
    <span class="day-meta">Трекер тренировок</span>
  </div>
  
  <div class="calendar-container">
    <div class="cal-top-bar">
      <button class="cal-nav-btn" onclick="navCalendar(-1)">‹</button>
      <div class="cal-month-title">${monthNames[calCurrentMonth]} ${calCurrentYear}</div>
      <button class="cal-nav-btn" onclick="navCalendar(1)">›</button>
    </div>
    
    <div class="cal-stats-ribbon">
      <div class="cal-stat-pill">
        <span class="lbl">Тренировок за месяц</span>
        <span class="val">${hist.length} сессий</span>
      </div>
      <div class="cal-stat-pill">
        <span class="lbl">Тоннаж за месяц</span>
        <span class="val">${Math.round(totalVolumeMonth / 1000 * 10) / 10} т</span>
      </div>
    </div>
    
    <div class="cal-weekdays">
      <span>ПН</span><span>ВТ</span><span>СР</span><span>ЧТ</span><span>ПТ</span><span>СБ</span><span>ВС</span>
    </div>
    
    <div class="cal-grid">
      ${cells.join('')}
    </div>
    
    <div id="cal-details-drawer">
      <div style="margin-top:16px; font-size:12px; color:var(--steel); text-align:center;">
        Нажмите на день с точкой (тренировкой) для просмотра отчёта
      </div>
    </div>
  </div>`;
  
  document.getElementById('main').innerHTML = html;
}

function navCalendar(delta){
  calCurrentMonth += delta;
  if (calCurrentMonth < 0) { calCurrentMonth = 11; calCurrentYear--; }
  else if (calCurrentMonth > 11) { calCurrentMonth = 0; calCurrentYear++; }
  renderCalendarScreen();
}

function showCalendarSessionDetails(date, title, volume, setsCount){
  const drawer = document.getElementById('cal-details-drawer');
  if (!drawer) return;
  drawer.innerHTML = `
  <div class="cal-session-drawer">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <b style="font-size:16px; color:#fff;">🔥 ${title}</b>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:13px; color:var(--chalk-dim);">

      </div>
    </div>
  </div>`;
  triggerHaptic(30);
}

  document.getElementById('main').innerHTML = html;
}

function stepWeightInput(delta){
  const el = document.getElementById('input-new-weight');
  if (el) {
    const cur = parseFloat(el.value) || 70.0;
    el.value = (Math.round((cur + delta) * 10) / 10).toFixed(1);
  }
}

function saveNewWeight(){
  const el = document.getElementById('input-new-weight');
  if (!el) return;
  const newW = parseFloat(el.value);
  if (!newW || newW <= 30 || newW >= 250) {
    alert('Пожалуйста, введите корректный вес в кг.');
    return;
  }
  
  const u = getCurUser();
  u.profile.currentWeight = newW;
  if (!u.profile.weightHistory) u.profile.weightHistory = [];
  
  const dateStr = new Date().toLocaleDateString('ru-RU', { day:'numeric', month:'short' });
  u.profile.weightHistory.unshift({ date: dateStr, weight: newW });
  
  saveState();
  updateHeaderUI();
  triggerHaptic(50);
  renderProfileScreen();
}

function openProfileModal(){
  const u = getCurUser();
  const modal = document.getElementById('edit-profile-modal');
  if (modal) {
    document.getElementById('modal-edit-name').value = u.profile.name || '';
    document.getElementById('modal-edit-height').value = u.profile.height || 178;
    modal.style.display = 'flex';
  }
}

function closeProfileModal(){
  const modal = document.getElementById('edit-profile-modal');
  if (modal) modal.style.display = 'none';
}

function saveProfileModal(){
  const name = document.getElementById('modal-edit-name').value.trim();
  const height = parseInt(document.getElementById('modal-edit-height').value, 10);
  if (!name) { alert('Введите имя'); return; }
  
  const u = getCurUser();
  u.profile.name = name;
  if (height > 100 && height < 250) u.profile.height = height;
  
  saveState();
  updateHeaderUI();
  closeProfileModal();
  renderProfileScreen();
}

function checkOnboarding(){
  if (!appState.profile || !appState.profile.created) {
    const modal = document.getElementById('onboarding-modal');
    if (modal) modal.style.display = 'flex';
  }
}

function completeOnboarding(){
  const name = document.getElementById('onboard-name').value.trim() || 'Виталий';
  const height = parseInt(document.getElementById('onboard-height').value, 10) || 178;
  const weight = parseFloat(document.getElementById('onboard-weight').value) || 72.0;
  
  appState.profile = {
    created: true,
    name: name,
    height: height,
    currentWeight: weight,
    weightHistory: [
      { date: new Date().toLocaleDateString('ru-RU', { day:'numeric', month:'short' }), weight: weight }
    ]
  };
  
  saveState();
  
  const modal = document.getElementById('onboarding-modal');
  if (modal) modal.style.display = 'none';
  
  updateHeaderUI();
  renderWorkoutScreen();
}

function updateHeaderUI(){
  const u = getCurUser();
  const prof = u.profile || { name: 'Виталий', height: 178, currentWeight: 72.0 };
  
  const hName = document.getElementById('header-username');
  if (hName) hName.textContent = prof.name;
  
  const hAvatar = document.getElementById('header-avatar');
  if (hAvatar) hAvatar.textContent = (prof.name[0] || 'А').toUpperCase();
  
  const hSubtitle = document.getElementById('app-subtitle');
  if (hSubtitle) {
    hSubtitle.textContent = `${prof.name} · ${prof.height} см · ${prof.currentWeight} кг`;
  }
}

/* ================== TAB SWITCHER ================== */
function switchMainTab(tab){
  appState.activeTab = tab;
  saveState();
  
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  
  window.scrollTo({ top: 0, behavior: 'instant' });
  
  if (tab === 'workout') {
    renderWorkoutScreen();
  } else if (tab === 'optimal' || tab === 'calc') {
    renderOptimalWeightScreen();
  } else if (tab === 'progress') {
    renderProgressScreen();
  } else if (tab === 'calendar' || tab === 'nutrition') {
    renderCalendarScreen();
  } else if (tab === 'profile') {
    renderProfileScreen();
  }
}

/* ================== VIDEO OBSERVER & PLAYBACK ================== */
let videoObserver = null;

function setupVideoObserver() {
  if (videoObserver) {
    videoObserver.disconnect();
  }
  const videoBoxes = document.querySelectorAll('.ex-video-box');
  if (!videoBoxes.length) return;

  videoObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const box = entry.target;
      const video = box.querySelector('video');
      if (!video) return;

      if (!entry.isIntersecting) {
        if (!video.paused) {
          video.pause();
        }
      }
    });
  }, { threshold: 0.25 });

  videoBoxes.forEach(box => videoObserver.observe(box));
}

function toggleVideoPlayback(box) {
  const video = box.querySelector('video');
  if (!video) return;

  if (video.paused) {
    document.querySelectorAll('.ex-video-box video').forEach(v => {
      if (v !== video && !v.paused) v.pause();
    });

    const playPromise = video.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {
        box.classList.add('is-paused');
      });
    }
  } else {
    video.pause();
  }
}

function handleVideoError(video) {
  const box = video.parentElement;
  if (!box) return;
  box.classList.remove('is-buffering');
  box.classList.add('is-paused');
  const errBanner = box.querySelector('.video-error-banner');
  if (errBanner) errBanner.style.display = 'flex';
  const playBtn = box.querySelector('.video-play-btn');
  if (playBtn) playBtn.style.display = 'none';
}

function exportDataJSON(){
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
  const dlAnchor = document.createElement('a');
  dlAnchor.setAttribute("href", dataStr);
  dlAnchor.setAttribute("download", `fitness_tracker_backup_${new Date().toISOString().slice(0,10)}.json`);
  document.body.appendChild(dlAnchor);
  dlAnchor.click();
  dlAnchor.remove();
}

function importDataJSON(event){
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const imported = JSON.parse(e.target.result);
      if (imported && (imported.profile || imported.history || imported.users)) {
        if (!imported.profile && imported.users) {
          // migrate
          const u = imported.users[imported.activeUser] || imported.users.user1;
          appState = {
            profile: { created: true, name: u.name || 'Виталий', height: 178, currentWeight: 72, weightHistory: [] },
            activeTab: 'workout',
            currentExerciseIndex: 0,
            sessionSets: u.sessionSets || {},
            history: u.history || [],
            prs: u.prs || {}
          };
        } else {
          appState = imported;
        }
        saveState();
        alert('Данные успешно импортированы!');
        location.reload();
      } else {
        alert('Некорректный файл резервной копии.');
      }
    } catch(err) {
      alert('Ошибка чтения файла JSON.');
    }
  };
  reader.readAsText(file);
}

function resetCurrentUserData(){
  if (confirm('ВНИМАНИЕ! Это действие удалит всю историю тренировок и сбросит профиль. Продолжить?')) {
    localStorage.removeItem('workout_pwa_data_v2');
    localStorage.removeItem('workout_pwa_data_v1');
    location.reload();
  }
}

// Initial boot
window.addEventListener('DOMContentLoaded', () => {
  updateHeaderUI();
  checkOnboarding();
  const initialTab = appState.activeTab || 'workout';
  switchMainTab(initialTab);
});
</script>
