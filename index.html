<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Фитнес Трекер">
<meta name="theme-color" content="#12110d">
<title>Фитнес Трекер: Прогресс & Веса</title>
<style>
  :root {
    --bg: #12110d;
    --surface: #1b1914;
    --surface-2: #24221b;
    --surface-3: #2e2b22;
    --line: #38342c;
    --line-light: #4a453b;
    --chalk: #f3eee3;
    --chalk-dim: #a6a192;
    --iron: #ff6022;
    --iron-hover: #ff7842;
    --iron-glow: rgba(255, 96, 34, 0.25);
    --iron-dim: #7a3a1b;
    --steel: #7b888e;
    --success: #2ecc71;
    --success-dim: rgba(46, 204, 113, 0.15);
    --gold: #f1c40f;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--chalk);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding-bottom: calc(75px + env(safe-area-inset-bottom));
    user-select: none;
  }
  input, button, select { font-family: inherit; }

  /* TOP HEADER */
  header.top-header {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: max(12px, env(safe-area-inset-top));
  }
  .header-left h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--chalk);
  }
  .header-left .meta {
    font-size: 12px;
    color: var(--chalk-dim);
    margin-top: 2px;
  }
  .account-switcher {
    display: flex;
    align-items: center;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 3px 6px 3px 4px;
    cursor: pointer;
    transition: all 0.2s ease;
    gap: 6px;
  }
  .account-switcher:active {
    transform: scale(0.96);
    border-color: var(--iron);
  }
  .avatar-badge {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--iron);
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .account-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--chalk);
    max-width: 90px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .account-arrow {
    font-size: 10px;
    color: var(--steel);
  }

  /* WORKOUT SUB-TABS */
  .workout-subtabs {
    display: flex;
    background: var(--surface);
    padding: 6px 12px 10px;
    gap: 6px;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .workout-subtabs::-webkit-scrollbar { display: none; }
  .subtab-btn {
    flex: 1;
    min-width: 70px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    border-radius: var(--radius-sm);
    padding: 8px 4px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .subtab-btn.active {
    background: var(--iron);
    color: #fff;
    border-color: var(--iron);
    box-shadow: 0 2px 8px var(--iron-glow);
  }

  /* MAIN CONTAINER */
  main#main {
    padding: 10px 14px 20px;
    max-width: 680px;
    margin: 0 auto;
  }

  /* WORKOUT HEADER BAR */
  .day-title-box {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 10px 4px 6px;
  }
  .day-title-box h2 {
    margin: 0;
    font-size: 22px;
    font-weight: 800;
    color: var(--chalk);
  }
  .day-title-box .day-meta {
    font-size: 12.5px;
    color: var(--steel);
  }

  /* EXERCISE CARD */
  .ex-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    margin-bottom: 16px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .ex-card-header {
    display: flex;
    gap: 12px;
    padding: 14px 14px 10px;
    align-items: flex-start;
  }
  .ex-icon {
    flex: 0 0 46px;
    width: 46px;
    height: 56px;
  }
  .ex-icon svg { width: 100%; height: 100%; overflow: visible; }
  .ex-header-body { flex: 1; min-width: 0; }
  .ex-title {
    font-size: 16.5px;
    font-weight: 800;
    margin: 0 0 4px;
    color: var(--chalk);
  }
  .ex-targets {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .target-badge {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 12px;
    font-weight: 700;
    color: var(--iron);
  }
  .rest-badge {
    font-size: 12px;
    color: var(--steel);
  }
  .weight-ref-badge {
    display: inline-block;
    background: var(--surface-3);
    color: var(--chalk-dim);
    font-size: 11.5px;
    padding: 2px 6px;
    border-radius: 3px;
    margin-top: 4px;
  }

  /* GIF VIDEO WRAP */
  .ex-video-box {
    margin: 6px 14px 10px;
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: #141310;
    border: 1px solid var(--line);
    position: relative;
    cursor: pointer;
    min-height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ex-video-box video {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    object-fit: cover;
  }
  .video-play-btn {
    position: absolute;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.7);
    border: 2px solid rgba(255, 255, 255, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    transition: all 0.2s ease;
    opacity: 1;
    transform: scale(1);
    box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    z-index: 2;
  }
  .video-play-btn svg {
    margin-left: 3px;
  }
  .ex-video-box:not(.is-paused) .video-play-btn {
    opacity: 0;
    transform: scale(0.7);
    pointer-events: none;
  }
  .video-spinner {
    display: none;
    position: absolute;
    width: 34px;
    height: 34px;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: var(--iron);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    pointer-events: none;
    z-index: 2;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .ex-video-box.is-buffering .video-spinner {
    display: block;
  }
  .ex-video-box.is-buffering .video-play-btn {
    display: none;
  }
  .video-tap-hint {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: rgba(0,0,0,0.75);
    color: var(--chalk);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 2;
  }
  .video-error-banner {
    position: absolute;
    inset: 0;
    background: rgba(18, 17, 13, 0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--chalk-dim);
    font-size: 12.5px;
    padding: 16px;
    text-align: center;
    z-index: 3;
  }
  .video-error-banner a {
    color: var(--iron);
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    padding: 7px 14px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  /* TIPS */
  .ex-tips {
    margin: 0 14px 12px;
    padding: 0;
    list-style: none;
  }
  .ex-tips li {
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--chalk-dim);
    position: relative;
    padding-left: 12px;
    margin-bottom: 3px;
  }
  .ex-tips li::before {
    content: "—";
    position: absolute;
    left: 0;
    color: var(--steel);
  }

  /* SETS TRACKER TABLE */
  .sets-container {
    background: var(--surface-2);
    border-top: 1px solid var(--line);
    padding: 10px 12px 12px;
  }
  .sets-table {
    width: 100%;
    border-collapse: collapse;
  }
  .sets-table th {
    font-size: 11px;
    font-weight: 700;
    color: var(--steel);
    text-align: center;
    padding-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .sets-table th:first-child { text-align: left; width: 28px; }
  .sets-table th:nth-child(2) { text-align: left; width: 68px; }
  .sets-table th:last-child { width: 36px; }
  
  .set-row {
    border-bottom: 1px solid rgba(56, 52, 44, 0.5);
  }
  .set-row:last-child { border-bottom: none; }
  .set-num {
    font-size: 13px;
    font-weight: 700;
    color: var(--chalk-dim);
  }
  .set-prev {
    font-size: 11.5px;
    color: var(--steel);
    white-space: nowrap;
  }
  .set-inputs-cell {
    padding: 5px 2px;
  }
  .stepper-wrap {
    display: inline-flex;
    align-items: center;
    background: var(--surface-3);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .stepper-btn {
    background: transparent;
    border: none;
    color: var(--chalk);
    font-size: 14px;
    font-weight: 700;
    width: 28px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .stepper-btn:active {
    background: var(--line);
    color: var(--iron);
  }
  .stepper-input {
    width: 44px;
    height: 32px;
    background: transparent;
    border: none;
    color: var(--chalk);
    font-size: 14px;
    font-weight: 800;
    text-align: center;
    outline: none;
    user-select: text;
  }
  .done-btn {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--surface-3);
    color: var(--steel);
    font-size: 15px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
  }
  .done-btn.completed {
    background: var(--success);
    color: #fff;
    border-color: var(--success);
    box-shadow: 0 2px 8px var(--success-dim);
  }
  .sets-actions {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    padding-top: 6px;
  }
  .action-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    font-size: 12px;
    font-weight: 700;
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .action-btn:active { background: var(--line); }

  /* PROGRESSION RECO BOX */
  .prog-reco-box {
    margin: 8px 0 2px;
    padding: 7px 10px;
    background: rgba(255, 96, 34, 0.12);
    border-left: 3px solid var(--iron);
    border-radius: 0 4px 4px 0;
    font-size: 12px;
    color: var(--chalk);
    line-height: 1.4;
  }
  .prog-reco-box b { color: var(--iron); }

  /* FINISH WORKOUT BUTTON */
  .finish-workout-box {
    padding: 14px 4px 20px;
    text-align: center;
  }
  .btn-finish {
    width: 100%;
    background: var(--iron);
    color: #fff;
    border: none;
    border-radius: var(--radius-md);
    padding: 15px 20px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 16px var(--iron-glow);
    transition: transform 0.1s;
  }
  .btn-finish:active { transform: scale(0.98); }

  /* FLOATING REST TIMER */
  .rest-timer-bar {
    position: fixed;
    bottom: calc(65px + env(safe-area-inset-bottom));
    left: 12px;
    right: 12px;
    max-width: 500px;
    margin: 0 auto;
    background: #1e1b15;
    border: 1.5px solid var(--iron);
    border-radius: var(--radius-md);
    box-shadow: 0 6px 24px rgba(0,0,0,0.6), 0 0 16px var(--iron-glow);
    padding: 10px 14px;
    display: none;
    align-items: center;
    justify-content: space-between;
    z-index: 200;
    animation: slideUp 0.25s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .timer-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .timer-display {
    font-size: 24px;
    font-weight: 900;
    color: var(--chalk);
    font-variant-numeric: tabular-nums;
  }
  .timer-label {
    font-size: 11px;
    color: var(--iron);
    font-weight: 700;
    text-transform: uppercase;
  }
  .timer-actions {
    display: flex;
    gap: 6px;
  }
  .timer-btn {
    background: var(--surface-3);
    border: 1px solid var(--line);
    color: var(--chalk);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .timer-btn:active { background: var(--line); }

  /* BOTTOM NAVIGATION */
  nav.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: calc(62px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--surface);
    border-top: 1px solid var(--line);
    display: flex;
    z-index: 150;
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: var(--steel);
    cursor: pointer;
    padding: 6px 0;
    transition: color 0.15s;
  }
  .nav-item.active {
    color: var(--iron);
  }
  .nav-icon {
    font-size: 19px;
    line-height: 1;
    margin-bottom: 2px;
  }
  .nav-label {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  /* CALCULATOR TAB */
  .calc-container {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 16px;
    margin-bottom: 16px;
  }
  .calc-title {
    font-size: 18px;
    font-weight: 800;
    margin: 0 0 12px;
    color: var(--chalk);
  }
  .calc-input-row {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }
  .calc-field {
    flex: 1;
  }
  .calc-field label {
    display: block;
    font-size: 12px;
    color: var(--steel);
    margin-bottom: 6px;
    font-weight: 700;
  }
  .calc-field input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    color: var(--chalk);
    font-size: 18px;
    font-weight: 800;
    padding: 10px 12px;
    text-align: center;
    outline: none;
  }
  .calc-field input:focus {
    border-color: var(--iron);
  }
  .onerm-hero {
    background: linear-gradient(135deg, rgba(255,96,34,0.18), rgba(255,96,34,0.05));
    border: 1px solid var(--iron-dim);
    border-radius: var(--radius-md);
    padding: 16px;
    text-align: center;
    margin-bottom: 18px;
  }
  .onerm-val {
    font-size: 38px;
    font-weight: 900;
    color: var(--iron);
    line-height: 1;
    margin-bottom: 4px;
  }
  .onerm-subtitle {
    font-size: 12.5px;
    color: var(--chalk-dim);
  }
  .rep-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  .rep-table th {
    text-align: left;
    color: var(--steel);
    padding: 6px 8px;
    border-bottom: 1px solid var(--line);
    font-size: 11.5px;
    text-transform: uppercase;
  }
  .rep-table td {
    padding: 9px 8px;
    border-bottom: 1px solid rgba(56,52,44,0.4);
  }
  .rep-table tr:last-child td { border-bottom: none; }
  .tag-hypertrophy { color: var(--iron); font-weight: 700; }
  .tag-strength { color: var(--gold); font-weight: 700; }
  .tag-endurance { color: #3498db; font-weight: 700; }

  /* PROGRESS & HISTORY TAB */
  .pr-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 14px;
    margin-bottom: 12px;
  }
  .pr-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--chalk);
    margin-bottom: 4px;
  }
  .pr-stats {
    font-size: 13px;
    color: var(--steel);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pr-weight {
    font-size: 17px;
    font-weight: 900;
    color: var(--gold);
  }

  /* MODAL */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 300;
    padding: 16px;
  }
  .modal-box {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 400px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }
  .modal-box h3 { margin: 0 0 14px; font-size: 19px; }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .btn-primary {
    flex: 1;
    background: var(--iron);
    color: #fff;
    border: none;
    padding: 12px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-secondary {
    flex: 1;
    background: var(--surface-2);
    color: var(--chalk);
    border: 1px solid var(--line);
    padding: 12px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  /* NUTRITION & SETTINGS */
  .nut-block { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .nut-block h3 { margin: 0 0 10px; font-size: 15.5px; font-weight: 800; color: var(--chalk); }
  .macro-row { display: flex; justify-content: space-between; font-size: 14.5px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .macro-row:last-child { border-bottom: none; }
  .macro-row b { color: var(--iron); }
  .nut-block p, .nut-block li { font-size: 13.5px; line-height: 1.55; color: var(--chalk-dim); }
  .nut-block ul { margin: 6px 0 0; padding-left: 16px; }

  /* SVG ANIMATION CATEGORIES */
  svg[data-cat] line { stroke: var(--iron); stroke-width: 4; stroke-linecap: round; }
  svg[data-cat] circle.head { fill: var(--iron); stroke: none; }
  svg[data-cat] .gear { stroke: var(--steel); stroke-width: 3; fill: none; stroke-linecap: round; }
  svg[data-cat] circle.gear { fill: var(--steel); stroke: none; }
  svg[data-cat] rect.gear { fill: var(--line); stroke: var(--steel); stroke-width: 2; }

  svg[data-cat="bench"] .j-w{animation:wY 1.7s ease-in-out infinite;}
  svg[data-cat="shoulder"] .j-w{animation:wYup 1.8s ease-in-out infinite;}
  svg[data-cat="row"] .j-w{animation:wRow 1.8s ease-in-out infinite;}
  svg[data-cat="pulldown"] .j-w{animation:wDown 1.8s ease-in-out infinite;}
  svg[data-cat="cablerow"] .j-w{animation:wCable 1.8s ease-in-out infinite;}
  svg[data-cat="calf"] .j-w{animation:wCalf 1.3s ease-in-out infinite;}
  @keyframes wY{0%,100%{transform:translateY(0);}50%{transform:translateY(16px);}}
  @keyframes wYup{0%,100%{transform:translateY(0);}50%{transform:translateY(-22px);}}
  @keyframes wRow{0%,100%{transform:translate(0,0);}50%{transform:translate(-16px,-18px);}}

/* ================== AUTOMATIC WORKOUT SCHEDULE (3/WEEK MOSCOW) ================== */
/**
 * 3 workouts per week: Monday, Wednesday, Friday
 * Cycle of 4 workouts: Верх 1 -> Низ 1 -> Верх 2 -> Низ 2 -> repeat
 * Base anchor: Monday, 14 September 2026 (Moscow time) = Верх 1
 */
function getMoscowDayInfo(date = new Date()) {
  try {
    const moscowStr = date.toLocaleString('en-US', { timeZone: 'Europe/Moscow' });
    const moscowDate = new Date(moscowStr);
    
    // Base: 2026-09-14 00:00:00 (Monday)
    const base = new Date(2026, 8, 14, 0, 0, 0);
    const cur = new Date(moscowDate.getFullYear(), moscowDate.getMonth(), moscowDate.getDate(), 0, 0, 0);
    
    const diffDays = Math.round((cur - base) / (1000 * 60 * 60 * 24));
    const fullWeeks = Math.floor(diffDays / 7);
    // Monday=0, Tuesday=1, Wednesday=2, Thursday=3, Friday=4, Saturday=5, Sunday=6
    const dow = (cur.getDay() + 6) % 7;
    
    const dayNames = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
    const cycle = [
      { key: 'verh1', title: 'Верх 1' },
      { key: 'niz1', title: 'Низ 1' },
      { key: 'verh2', title: 'Верх 2' },
      { key: 'niz2', title: 'Низ 2' }
    ];
    
    let trainingIndex;
    let isTrainingDay = false;
    let nextDayText = '';
    
    if (dow === 0) { // Mon
      trainingIndex = fullWeeks * 3 + 0;
      isTrainingDay = true;
      nextDayText = 'Среда (' + cycle[((trainingIndex + 1) % 4 + 4) % 4].title + ')';
    } else if (dow === 1) { // Tue
      trainingIndex = fullWeeks * 3 + 1;
      isTrainingDay = false;
      nextDayText = 'Среда (' + cycle[((trainingIndex) % 4 + 4) % 4].title + ')';
    } else if (dow === 2) { // Wed
      trainingIndex = fullWeeks * 3 + 1;
      isTrainingDay = true;
      nextDayText = 'Пятница (' + cycle[((trainingIndex + 1) % 4 + 4) % 4].title + ')';
    } else if (dow === 3) { // Thu
      trainingIndex = fullWeeks * 3 + 2;
      isTrainingDay = false;
      nextDayText = 'Пятница (' + cycle[((trainingIndex) % 4 + 4) % 4].title + ')';
    } else if (dow === 4) { // Fri
      trainingIndex = fullWeeks * 3 + 2;
      isTrainingDay = true;
      nextDayText = 'Понедельник (' + cycle[((trainingIndex + 1) % 4 + 4) % 4].title + ')';
    } else { // Sat, Sun
      trainingIndex = (fullWeeks + 1) * 3 + 0;
      isTrainingDay = false;
      nextDayText = 'Понедельник (' + cycle[((trainingIndex) % 4 + 4) % 4].title + ')';
    }
    
    const cycleIdx = ((trainingIndex % 4) + 4) % 4;
    const targetWorkout = cycle[cycleIdx];
    
    return {
      curDateStr: cur.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }),
      dayName: dayNames[dow],
      isTrainingDay,
      targetKey: targetWorkout.key,
      targetTitle: targetWorkout.title,
      nextDayText
    };
  } catch(e) {
    return {
      curDateStr: 'Сегодня',
      dayName: 'Тренировочный день',
      isTrainingDay: true,
      targetKey: 'verh1',
      targetTitle: 'Верх 1',
      nextDayText: 'Среда (Низ 1)'
    };
  }
}

/* ================== SOUND & HAPTIC ================== */
let audioCtx = null;
function playBeep(){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Note A5
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  } catch(e){}
}

function triggerHaptic(duration = 40){
  try {
    if (navigator.vibrate) navigator.vibrate(duration);
  } catch(e){}
}

/* ================== REST TIMER ================== */
let timerInterval = null;
let timerSecondsLeft = 0;

function startRestTimer(seconds = 120){
  clearInterval(timerInterval);
  timerSecondsLeft = seconds;
  const bar = document.getElementById('rest-timer-bar');
  bar.style.display = 'flex';
  updateTimerUI();
  
  timerInterval = setInterval(()=>{
    timerSecondsLeft--;
    if (timerSecondsLeft <= 0) {
      clearInterval(timerInterval);
      playBeep();
      triggerHaptic([100, 50, 150]);
      setTimeout(playBeep, 250);
      bar.style.display = 'none';
    } else {
      updateTimerUI();
    }
  }, 1000);
}

function updateTimerUI(){
  const el = document.getElementById('timer-countdown');
  const m = Math.floor(timerSecondsLeft / 60);
  const s = timerSecondsLeft % 60;
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function adjustTimer(deltaSec){
  timerSecondsLeft = Math.max(5, timerSecondsLeft + deltaSec);
  updateTimerUI();
}

function stopRestTimer(){
  clearInterval(timerInterval);
  document.getElementById('rest-timer-bar').style.display = 'none';
}

/* ================== 1RM CALCULATIONS ================== */
// Epley formula: 1RM = Weight * (1 + Reps / 30)
function calc1RM(weight, reps){
  if (!weight || weight <= 0) return 0;
  if (reps <= 1) return Math.round(weight * 10) / 10;
  const est = weight * (1 + reps / 30);
  return Math.round(est * 10) / 10;
}

// Target weights for percentage table
function calcWeightForReps(oneRM, targetReps){
  if (!oneRM || oneRM <= 0) return 0;
  // Inverse Epley
  const w = oneRM / (1 + targetReps / 30);
  // Round to nearest 0.5 or 2.5 kg
  return Math.round(w * 2) / 2;
}

/* ================== WORKOUT LOGIC ================== */
function initExerciseSets(exName, exDef){
  const u = getCurUser();
  if (!u.sessionSets[exName]) {
    // Determine default sets count (e.g. "3x6-8" -> 3 sets)
    let numSets = 3;
    let targetWeight = 0;
    const matchSets = exDef.sets.match(/^(\d+)×/);
    if (matchSets) numSets = parseInt(matchSets[1], 10);
    
    // Check if we have previous history
    const lastSession = getLastExerciseSession(exName);
    if (lastSession && lastSession.length) {
      u.sessionSets[exName] = lastSession.map(s => ({
        weight: s.weight,
        reps: s.reps,
        done: false
      }));
    } else {
      // Default initial weight from note or 0
      const matchWeight = (exDef.weight || '').match(/(\d+(\.\d+)?)/);
      if (matchWeight) targetWeight = parseFloat(matchWeight[1]);
      
      const defaultRepsMatch = exDef.sets.match(/×(\d+)/);
      const defaultReps = defaultRepsMatch ? parseInt(defaultRepsMatch[1], 10) : 8;

      u.sessionSets[exName] = [];
      for (let i = 0; i < numSets; i++) {
        u.sessionSets[exName].push({
          weight: targetWeight,
          reps: defaultReps,
          done: false
        });
      }
    }
    saveState();
  }
}

function getLastExerciseSession(exName){
  const u = getCurUser();
  for (let i = u.history.length - 1; i >= 0; i--) {
    const h = u.history[i];
    if (h.exercises && h.exercises[exName]) {
      return h.exercises[exName];
    }
  }
  return null;
}

function updateSetField(exName, setIndex, field, value){
  const u = getCurUser();
  if (u.sessionSets[exName] && u.sessionSets[exName][setIndex]) {
    u.sessionSets[exName][setIndex][field] = Math.max(0, parseFloat(value) || 0);
    saveState();
  }
}

function stepSetField(exName, setIndex, field, step){
  const u = getCurUser();
  if (u.sessionSets[exName] && u.sessionSets[exName][setIndex]) {
    const cur = u.sessionSets[exName][setIndex][field] || 0;
    const updated = Math.max(0, Math.round((cur + step) * 10) / 10);
    u.sessionSets[exName][setIndex][field] = updated;
    saveState();
    // update DOM directly for snappy responsiveness
    const inputEl = document.getElementById(`input-${exName}-${setIndex}-${field}`);
    if (inputEl) inputEl.value = updated;
  }
}

function toggleSetDone(exName, setIndex, restSec = 120){
  const u = getCurUser();
  if (u.sessionSets[exName] && u.sessionSets[exName][setIndex]) {
    const setObj = u.sessionSets[exName][setIndex];
    setObj.done = !setObj.done;
    saveState();
    
    const btn = document.getElementById(`btn-done-${exName}-${setIndex}`);
    if (btn) {
      btn.classList.toggle('completed', setObj.done);
      btn.textContent = setObj.done ? '✓' : '';
    }
    
    if (setObj.done) {
      triggerHaptic(40);
      // Check for PR
      const est1RM = calc1RM(setObj.weight, setObj.reps);
      const curPr = u.prs[exName] ? u.prs[exName].est1RM : 0;
      if (est1RM > curPr) {
        u.prs[exName] = {
          weight: setObj.weight,
          reps: setObj.reps,
          est1RM: est1RM,
          date: new Date().toLocaleDateString('ru-RU')
        };
        saveState();
      }
      // Start rest timer
      startRestTimer(restSec);
    }
    
    // Check if exercise completed for progression feedback
    updateProgressionFeedback(exName);
  }
}

function addSet(exName){
  const u = getCurUser();
  if (u.sessionSets[exName]) {
    const last = u.sessionSets[exName][u.sessionSets[exName].length - 1] || {weight:0, reps:8};
    u.sessionSets[exName].push({
      weight: last.weight,
      reps: last.reps,
      done: false
    });
    saveState();
    renderWorkoutScreen();
  }
}

function removeSet(exName){
  const u = getCurUser();
  if (u.sessionSets[exName] && u.sessionSets[exName].length > 1) {
    u.sessionSets[exName].pop();
    saveState();
    renderWorkoutScreen();
  }
}

function updateProgressionFeedback(exName){
  const box = document.getElementById(`prog-reco-${exName}`);
  if (!box) return;
  const u = getCurUser();
  const sets = u.sessionSets[exName] || [];
  const allDone = sets.length > 0 && sets.every(s => s.done);
  if (!allDone) {
    box.style.display = 'none';
    return;
  }
  
  // Analyze progression
  const maxRep = Math.max(...sets.map(s=>s.reps));
  const minRep = Math.min(...sets.map(s=>s.reps));
  const avgWeight = Math.round(sets.reduce((a,b)=>a+b.weight, 0) / sets.length * 10)/10;
  const est1RM = calc1RM(avgWeight, maxRep);
  
  // Progression prompt
  if (minRep >= 8) {
    box.innerHTML = `🔥 <b>Отличный прогресс!</b> Все ${sets.length} подходов закрыты по верхней границе повторений (≥${minRep}). Рекомендация на следующую тренировку: <b>${Math.round((avgWeight + 2.5)*10)/10} кг (+2.5 кг)</b>.`;
    box.style.display = 'block';
  } else if (minRep < 6 && avgWeight > 0) {
    const recWeight = Math.max(0, Math.round((avgWeight - 2.5)*10)/10);
    box.innerHTML = `💡 <b>Оптимизация стимула:</b> Повторения (${minRep}) ниже диапазона гипертрофии (6-8). Рекомендуем чуть снизить вес до <b>${recWeight} кг</b>, чтобы набрать чистый рабочий объём.`;
    box.style.display = 'block';
  } else {
    box.innerHTML = `💪 <b>Рабочий вес зафиксирован:</b> Расчётный 1ПМ = <b>${est1RM} кг</b>. Повторите этот вес на следующей тренировке до закрытия верхней границы повторов.`;
    box.style.display = 'block';
  }
}

function finishCurrentWorkout(){
  const u = getCurUser();
  const dayKey = u.activeDay;
  const w = workouts[dayKey];
  if (!w) return;
  
  let totalVolume = 0;
  let totalCompletedSets = 0;
  const savedEx = {};
  
  w.exercises.forEach(ex => {
    const sets = u.sessionSets[ex.name] || [];
    const completed = sets.filter(s => s.done);
    if (completed.length) {
      savedEx[ex.name] = completed.map(s => ({ weight: s.weight, reps: s.reps }));
      completed.forEach(s => {
        totalVolume += (s.weight * s.reps);
        totalCompletedSets++;
      });
    }
  });
  
  if (totalCompletedSets === 0) {
    alert('Вы ещё не отметили ни одного выполненного подхода (✓)!');
    return;
  }
  
  const historyEntry = {
    date: new Date().toLocaleDateString('ru-RU', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }),
    dayKey: dayKey,
    dayTitle: w.title,
    volume: Math.round(totalVolume),
    setsCount: totalCompletedSets,
    exercises: savedEx
  };
  
  u.history.unshift(historyEntry);
  
  // Clear current day session done flags for next time
  w.exercises.forEach(ex => {
    if (u.sessionSets[ex.name]) {
      u.sessionSets[ex.name].forEach(s => s.done = false);
    }
  });
  
  saveState();
  triggerHaptic([150, 100, 200]);
  
  alert(`🎉 Тренировка «${w.title}» завершена!\n\nВыполнено подходов: ${totalCompletedSets}\nОбщий тоннаж: ${Math.round(totalVolume)} кг\nДанные сохранены в истории прогресса.`);
  switchMainTab('progress');
}

/* ================== VIDEO OBSERVER & PLAYBACK ================== */
let videoObserver = null;

function setupVideoObserver() {
  if (videoObserver) {
    videoObserver.disconnect();
  }
  
  const boxes = document.querySelectorAll('.ex-video-box');
  if (!boxes.length) return;
  
  if ('IntersectionObserver' in window) {
    videoObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const box = entry.target;
        const video = box.querySelector('video');
        if (!video) return;
        
        // When video is well inside the screen: autoplay
        if (entry.isIntersecting && entry.intersectionRatio >= 0.45) {
          video.muted = true;
          const p = video.play();
          if (p !== undefined) {
            p.then(() => {
              box.classList.remove('is-paused');
              const h = box.querySelector('.video-tap-hint');
              if (h) h.textContent = '⏸ Пауза';
            }).catch(() => {
              box.classList.add('is-paused');
              const h = box.querySelector('.video-tap-hint');
              if (h) h.textContent = '▶ Нажмите для запуска';
            });
          }
        } else {
          // When scrolled away: pause to conserve memory, data & battery
          if (!video.paused) {
            video.pause();
            box.classList.add('is-paused');
            const h = box.querySelector('.video-tap-hint');
            if (h) h.textContent = '▶ Нажмите для запуска';
          }
        }
      });
    }, {
      threshold: [0.1, 0.45, 0.7]
    });

    boxes.forEach(box => {
      box.classList.add('is-paused');
      videoObserver.observe(box);
    });
  } else {
    // Fallback if no IntersectionObserver
    boxes.forEach(box => {
      box.classList.add('is-paused');
    });
  }
}

function toggleVideoPlayback(box) {
  const video = box.querySelector('video');
  if (!video) return;
  
  const hint = box.querySelector('.video-tap-hint');
  if (video.paused) {
    // Pause other videos on the page
    document.querySelectorAll('.ex-video-box video').forEach(v => {
      if (v !== video && !v.paused) {
        v.pause();
        v.parentElement.classList.add('is-paused');
        const h = v.parentElement.querySelector('.video-tap-hint');
        if (h) h.textContent = '▶ Нажмите для запуска';
      }
    });
    
    video.muted = true;
    const playPromise = video.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        box.classList.remove('is-paused');
        if (hint) hint.textContent = '⏸ Пауза';
      }).catch(err => {
        console.warn('Playback blocked:', err);
        box.classList.add('is-paused');
        if (hint) hint.textContent = '▶ Нажмите для запуска';
      });
    }
  } else {
    video.pause();
    box.classList.add('is-paused');
    if (hint) hint.textContent = '▶ Нажмите для запуска';
  }
}

function handleVideoError(video) {
  console.warn('Video load error:', video.src);
  const box = video.parentElement;
  if (!box) return;
  box.classList.remove('is-buffering');
  box.classList.add('is-paused');
  const banner = box.querySelector('.video-error-banner');
  if (banner) banner.style.display = 'flex';
  const hint = box.querySelector('.video-tap-hint');
  if (hint) hint.style.display = 'none';
  const btn = box.querySelector('.video-play-btn');
  if (btn) btn.style.display = 'none';
}

// User-gesture touch unlock for mobile iOS/Android
let userTouchUnlocked = false;
function unlockMobileMedia() {
  if (userTouchUnlocked) return;
  userTouchUnlocked = true;
  document.removeEventListener('touchstart', unlockMobileMedia);
  document.removeEventListener('click', unlockMobileMedia);
  
  const firstBox = document.querySelector('.ex-video-box');
  if (firstBox) {
    const v = firstBox.querySelector('video');
    if (v && v.paused) {
      v.muted = true;
      v.play().then(() => {
        firstBox.classList.remove('is-paused');
        const h = firstBox.querySelector('.video-tap-hint');
        if (h) h.textContent = '⏸ Пауза';
      }).catch(()=>{});
    }
  }
}
document.addEventListener('touchstart', unlockMobileMedia, { passive: true });
document.addEventListener('click', unlockMobileMedia, { passive: true });

      <div class="onerm-val" id="calc-result-1rm">76 кг</div>
      <div class="onerm-subtitle">Расчётный 1ПМ (Одноповторный максимум)</div>
    </div>
    
    <div class="calc-title" style="font-size:15px; margin-top:20px;">Оптимальные рабочие веса:</div>
    <table class="rep-table" id="calc-table"></table>
  </div>`;
  
  document.getElementById('main').innerHTML = html;
  recalc1RM();
}

function recalc1RM(){
  const w = parseFloat(document.getElementById('calc-weight').value) || 0;
  const r = parseInt(document.getElementById('calc-reps').value, 10) || 1;
  const onerm = calc1RM(w, r);
  
  const heroEl = document.getElementById('calc-result-1rm');
  if (heroEl) heroEl.textContent = `${Math.round(onerm)} кг`;
  
  const tableEl = document.getElementById('calc-table');
  if (!tableEl) return;
  
  const zones = [
    { pct: 100, reps: 1, label: 'Пиковая сила', cls: 'tag-strength' },
    { pct: 90, reps: 3, label: 'Силовой блок', cls: 'tag-strength' },
    { pct: 85, reps: 5, label: 'Силовая гипертрофия', cls: 'tag-strength' },
    { pct: 80, reps: 8, label: 'Оптимум гипертрофии', cls: 'tag-hypertrophy' },
    { pct: 75, reps: 10, label: 'Объёмная гипертрофия', cls: 'tag-hypertrophy' },
    { pct: 70, reps: 12, label: 'Пампинг / выносливость', cls: 'tag-hypertrophy' },
    { pct: 65, reps: 15, label: 'Выносливость', cls: 'tag-endurance' }
  ];
  
  tableEl.innerHTML = `
    <thead>
      <tr>
        <th>Зона</th>
        <th>% 1ПМ</th>
        <th>Повт.</th>
        <th style="text-align:right;">Вес (кг)</th>
      </tr>
    </thead>
    <tbody>
      ${zones.map(z => {
        const targetW = Math.round((onerm * z.pct / 100) * 2) / 2;
        return `
        <tr>
          <td class="${z.cls}">${z.label}</td>
          <td style="color:var(--steel); font-weight:700;">${z.pct}%</td>
          <td style="font-weight:700;">${z.reps}</td>
          <td style="text-align:right; font-weight:800; font-size:15px; color:var(--chalk);">${targetW} кг</td>
        </tr>`;
      }).join('')}
    </tbody>
  `;
}

/* ================== PROGRESS SCREEN ================== */
function renderProgressScreen(){
  const u = getCurUser();
  const prList = Object.keys(u.prs).map(k => ({ name: k, ...u.prs[k] }));
  
  let html = `
  <div class="day-title-box">
    <h2>Прогресс</h2>
    <span class="day-meta">${u.name} · Аналитика</span>
  </div>`;
  
  // Total summary
  const totalWorkouts = u.history.length;
  const totalVolume = u.history.reduce((a,b)=>a + (b.volume || 0), 0);
  
  html += `
  <div style="display:flex; gap:10px; margin-bottom:16px;">
    <div class="pr-card" style="flex:1; text-align:center; padding:12px;">
      <div style="font-size:22px; font-weight:900; color:var(--iron);">${totalWorkouts}</div>
      <div style="font-size:11.5px; color:var(--steel); margin-top:2px;">Тренировок</div>
    </div>
    <div class="pr-card" style="flex:1; text-align:center; padding:12px;">
      <div style="font-size:22px; font-weight:900; color:var(--gold);">${Math.round(totalVolume/1000)} т</div>
      <div style="font-size:11.5px; color:var(--steel); margin-top:2px;">Тоннаж</div>
    </div>
    <div class="pr-card" style="flex:1; text-align:center; padding:12px;">
      <div style="font-size:22px; font-weight:900; color:var(--success);">${prList.length}</div>
      <div style="font-size:11.5px; color:var(--steel); margin-top:2px;">Рекордов</div>
    </div>
  </div>`;
  
  // PRs section
  html += `<h3 style="margin:16px 0 10px; font-size:16px; color:var(--chalk);">🏆 Личные рекорды (1ПМ)</h3>`;
  if (!prList.length) {
    html += `<div class="pr-card" style="color:var(--steel); text-align:center; padding:20px;">
      Пока нет зафиксированных рекордов. Выполняйте подходы на тренировке, и здесь появится статистика!
    </div>`;
  } else {
    prList.sort((a,b)=>b.est1RM - a.est1RM);
    html += prList.map(pr => `
      <div class="pr-card">
        <div class="pr-title">${pr.name}</div>
        <div class="pr-stats">
          <span>Сет: <b>${pr.weight} кг × ${pr.reps}</b> (${pr.date})</span>
          <span class="pr-weight">${Math.round(pr.est1RM)} кг 1ПМ</span>
        </div>
      </div>
    `).join('');
  }
  
  // History section
  html += `<h3 style="margin:20px 0 10px; font-size:16px; color:var(--chalk);">📅 История тренировок</h3>`;
  if (!u.history.length) {
    html += `<div class="pr-card" style="color:var(--steel); text-align:center; padding:20px;">
      История пуста. Нажмите «Завершить тренировку» после занятия, чтобы сохранить запись.
    </div>`;
  } else {
    html += u.history.slice(0, 15).map(h => `
      <div class="pr-card">
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;">
          <b style="font-size:15.5px; color:var(--chalk);">${h.dayTitle}</b>
          <span style="font-size:12px; color:var(--steel);">${h.date}</span>
        </div>
        <div style="font-size:12.5px; color:var(--chalk-dim); margin-bottom:6px;">
          Подходов: <b>${h.setsCount}</b> · Тоннаж: <b style="color:var(--iron);">${h.volume} кг</b>
        </div>
        <div style="font-size:12px; color:var(--steel); line-height:1.4;">
          ${Object.keys(h.exercises || {}).map(k => `${k} (${(h.exercises[k]||[]).map(s=>`${s.weight}×${s.reps}`).join(', ')})`).join('<br>')}
        </div>
      </div>
    `).join('');
  }
  
  document.getElementById('main').innerHTML = html;
}

/* ================== PROFILE & DATA SYNC ================== */
function renderProfileScreen(){
  const u = getCurUser();
  const html = `
  <div class="day-title-box">
    <h2>Профиль</h2>
    <span class="day-meta">Аккаунты & Синхронизация</span>
  </div>
  
  <div class="calc-container">
    <div style="display:flex; align-items:center; gap:14px; margin-bottom:16px;">
      <div class="avatar-badge" style="width:48px; height:48px; font-size:20px;">${u.name.charAt(0)}</div>
      <div>

    </div>

  </div>
  
  <div class="calc-container">
    <div class="calc-title">Резервное копирование и экспорт</div>
    <p style="font-size:13px; color:var(--chalk-dim); margin-top:0; line-height:1.45;">
      Приложение работает автономно (PWA / GitHub Pages). Все ваши тренировки и рекорды сохраняются в памяти устройства. Вы можете в любой момент выгрузить файл базы данных и перенести на другое устройство.
    </p>
    
    <div style="display:flex; flex-direction:column; gap:10px; margin-top:14px;">
      <button class="btn-primary" onclick="exportDataJSON()">📥 Экспорт базы данных (JSON)</button>
      <button class="btn-secondary" onclick="document.getElementById('import-file').click()">📤 Импорт базы данных (JSON)</button>
      <input type="file" id="import-file" accept=".json" style="display:none;" onchange="importDataJSON(event)">
    </div>
    
    <div style="margin-top:20px; border-top:1px solid var(--line); padding-top:14px;">
      <button class="btn-secondary" style="color:#e74c3c; width:100%;" onclick="resetCurrentUserData()">⚠️ Сбросить историю активного аккаунта</button>
    </div>

  document.getElementById('main').innerHTML = html;

function exportDataJSON(){
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", `workout_backup_${new Date().toISOString().slice(0,10)}.json`);
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
}

function importDataJSON(event){
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const parsed = JSON.parse(e.target.result);
      if (parsed && parsed.users) {
        appState = parsed;
        saveState();
        alert('База данных успешно импортирована!');
        updateHeaderUI();
        switchMainTab('workout');
      } else {
        alert('Некорректный формат файла бэкапа.');
      }
    } catch(err){
      alert('Ошибка при чтении файла JSON.');
    }
  };
  reader.readAsText(file);
}

function resetCurrentUserData(){
  const u = getCurUser();
  if (confirm(`Вы уверены, что хотите сбросить историю и рекорды аккаунта «${u.name}»? Это действие необратимо.`)) {
    u.sessionSets = {};
    u.history = [];
    u.prs = {};
    saveState();
    alert('История сброшена.');
    switchMainTab('workout');
  }
}

/* ================== NAVIGATION & ROUTING ================== */
let currentMainTab = 'workout';

function switchMainTab(tab){
  currentMainTab = tab;
  document.querySelectorAll('nav.bottom-nav .nav-item').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  
  const subtabs = document.getElementById('workout-subtabs');
  if (tab === 'workout') {
    subtabs.style.display = 'flex';
    renderWorkoutScreen();
  } else {
    subtabs.style.display = 'none';
    if (tab === 'calc') renderCalculatorScreen();
    else if (tab === 'progress') renderProgressScreen();
    else if (tab === 'nutrition') renderNutritionScreen();
    else if (tab === 'profile') renderProfileScreen();
  }
  window.scrollTo(0, 0);
}

function switchWorkoutDay(dayKey){
  const u = getCurUser();
  u.activeDay = dayKey;
  saveState();
  
  document.querySelectorAll('#workout-subtabs .subtab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.day === dayKey);
  });
  renderWorkoutScreen();
  window.scrollTo(0, 0);
}

/* ================== USER MODAL ================== */
function toggleUserModal(forceOpen = false){
  const m = document.getElementById('user-modal');
  const isCurrentlyOpen = m.style.display === 'flex';
  const shouldOpen = forceOpen ? true : !isCurrentlyOpen;
  m.style.display = shouldOpen ? 'flex' : 'none';
  if (shouldOpen) {
    const u = getCurUser();
    const editName = document.getElementById('edit-name');
    const editStats = document.getElementById('edit-stats');
    if (editName) editName.value = u.name;
    if (editStats) editStats.value = u.stats;
    
    const n1 = document.getElementById('modal-name-u1');
    const n2 = document.getElementById('modal-name-u2');
    const s1 = document.getElementById('modal-stats-u1');
    const s2 = document.getElementById('modal-stats-u2');
    if (n1) n1.textContent = appState.users.user1.name;
    if (n2) n2.textContent = appState.users.user2.name;
    if (s1) s1.textContent = appState.users.user1.stats || 'Атлет 1';
    if (s2) s2.textContent = appState.users.user2.stats || 'Атлет 2';
    
    const c1 = document.getElementById('card-u1');
    const c2 = document.getElementById('card-u2');
    if (c1) c1.classList.toggle('active', appState.activeUser === 'user1');
    if (c2) c2.classList.toggle('active', appState.activeUser === 'user2');
  }
}

function selectAccount(userId){
  appState.activeUser = userId;
  try {
    localStorage.setItem('workout_active_user_v2', userId);
    localStorage.setItem('workout_user_chosen_v2', 'true');
  } catch(e){}
  saveState();
  updateHeaderUI();
  toggleUserModal(false);
  
  // Also synchronize active scheduled day if user switches account
  const sched = getMoscowDayInfo();
  const u = getCurUser();
  if (!u.activeDay) u.activeDay = sched.targetKey;
  
  switchMainTab(currentMainTab);
}

function saveProfileChanges(){
  const u = getCurUser();
  const newName = document.getElementById('edit-name').value.trim();
  const newStats = document.getElementById('edit-stats').value.trim();
  if (newName) u.name = newName;
  if (newStats) u.stats = newStats;
  saveState();
  updateHeaderUI();
  toggleUserModal();
  if (currentMainTab === 'profile') renderProfileScreen();
}

function updateHeaderUI(){
  const u = getCurUser();
  document.getElementById('header-username').textContent = u.name;
  document.getElementById('header-avatar').textContent = u.name.charAt(0).toUpperCase();
  document.getElementById('app-subtitle').textContent = `${u.name} · ${u.stats}`;
}

/* ================== INITIALIZATION & MIGRATION ================== */
// 1. Data Migration for existing localStorage (rename user1/user2 to Vitalik and Ilya)
try {
  if (appState.users) {
    if (appState.users.user1 && (appState.users.user1.name === 'Илья' || !appState.users.user1.name)) {
      appState.users.user1.name = 'Виталик';
      if (!appState.users.user1.stats || appState.users.user1.stats.includes('67')) {
        appState.users.user1.stats = '178 см · 72 кг';
      }
    }
    if (appState.users.user2 && (appState.users.user2.name === 'Атлет 2' || !appState.users.user2.name)) {
      appState.users.user2.name = 'Илья';
      if (!appState.users.user2.stats || appState.users.user2.stats.includes('75')) {
        appState.users.user2.stats = '180 см · 68 кг';
      }
    }
    saveState();
  }
} catch(e){}

// 2. Remember last active user from localStorage
try {
  const savedUser = localStorage.getItem('workout_active_user_v2');
  if (savedUser && appState.users[savedUser]) {
    appState.activeUser = savedUser;
  }
} catch(e){}

// 3. Set today's scheduled workout as default for current user
try {
  const sched = getMoscowDayInfo();
  const u = getCurUser();
  // If active day was not set or matches initial default, set to today's schedule
  u.activeDay = sched.targetKey;
  saveState();
} catch(e){}

updateHeaderUI();
switchMainTab('workout');

// 4. If first time ever on this device, prompt to choose between Vitalik and Ilya
try {
  const hasChosen = localStorage.getItem('workout_user_chosen_v2');
  if (!hasChosen) {
    setTimeout(() => {
      toggleUserModal(true);
    }, 350);
  }
} catch(e){}
</script>
